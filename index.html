<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>风洞实验室 · Wind Tunnel Laboratory</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070d; color: #8b9ab8;
               font: 13px/1.7 system-ui, "Microsoft YaHei", sans-serif; }
  #pick { position: absolute; inset: 0; display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 10px; padding: 24px; text-align: center; }
  #pick h1 { font-size: 15px; color: #c9d3e8; font-weight: 600; margin: 0; }
  #pick .sub { font-size: 11.5px; color: #5d6a82; }
  #pick a { display: inline-block; margin-top: 6px; padding: 9px 16px; border-radius: 9px;
            border: 1px solid #232b3e; background: #141a26; color: #cfd8ea;
            text-decoration: none; font-size: 12px; }
  #pick a:hover { background: #1b2333; }
  #pick a.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
</style>
</head>
<body>
<!--
  入口页：只做一件事 —— 决定用哪个引擎，然后跳过去。

  为什么不是把 GPU 版代码直接写进 index.html：
  网页只维护一份，GPU 版就在 gpu/gpu-fluid.html，这里再复制一遍必然分叉。

  ?cpu=1 可以强制用 CPU 版（老设备 / 想对比时用）。
-->
<div id="pick">
  <h1>风洞实验室</h1>
  <div class="sub">正在选择求解器…</div>
  <div>
    <a id="goGpu" class="primary" href="gpu/gpu-fluid.html">GPU 版（WebGL2）</a>
    <a id="goCpu" href="cpu.html">CPU 版（兼容旧设备）</a>
  </div>
</div>
<script>
"use strict";
(function () {
  var qs = new URLSearchParams(location.search);
  var search = location.search;               // 参数原样带过去（?preset= / ?sim= 之类）

  // 能力探测：WebGL2 + 浮点渲染目标，缺一个就只能退回 CPU 版
  var gpuOk = false;
  if (qs.get('cpu') !== '1') {
    try {
      var cv = document.createElement('canvas');
      var gl = cv.getContext('webgl2');
      gpuOk = !!(gl && gl.getExtension('EXT_color_buffer_float'));
    } catch (e) { gpuOk = false; }
  }

  var target = gpuOk ? 'gpu/gpu-fluid.html' : 'cpu.html';
  var noauto = qs.get('noauto');              // ?noauto=1：只显示按钮，不自动跳（调试入口用）
  if (!noauto) {
    // 用 replace：别把入口页留在历史里，按返回直接退出
    location.replace(target + search);
  } else {
    document.querySelector('#pick .sub').textContent =
      gpuOk ? '检测到 WebGL2，可跑 GPU 版' : '没有 WebGL2 / 浮点渲染目标，只能用 CPU 版';
    document.getElementById('goGpu').href = 'gpu/gpu-fluid.html' + search;
    document.getElementById('goCpu').href = 'cpu.html' + search;
  }
})();
</script>
</body>
</html>
