<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>风洞实验室 v2 · Stable Fluids</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; background: #080b12; color: #e6e9f2;
    font: 14px/1.5 "Microsoft YaHei UI", system-ui, sans-serif; overflow: hidden;
  }
  aside {
    width: 264px; flex: 0 0 264px; padding: 14px; overflow-y: auto;
    background: #0d1119; border-right: 1px solid #1e2534;
  }
  aside h1 { font-size: 15px; margin: 0 0 2px; }
  aside .sub { font-size: 11px; color: #6b7894; margin-bottom: 12px; }
  .group { margin-bottom: 13px; }
  .group > label { display: block; font-size: 12px; color: #94a2c0; margin-bottom: 5px; }
  input[type=range] { width: 100%; }
  .val { float: right; color: #5eead4; font-variant-numeric: tabular-nums; }
  button {
    font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 8px; cursor: pointer;
    border: 1px solid #232b3e; background: #151b28; color: #dbe2f3; width: 100%; margin-bottom: 7px;
  }
  button:hover { background: #1d2536; }
  button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
  #drop {
    border: 2px dashed #232b3e; border-radius: 10px; padding: 12px; text-align: center;
    color: #6b7894; font-size: 12px; margin-bottom: 9px;
  }
  #drop.hi { border-color: #2563eb; color: #93c5fd; }
  .seg { display: flex; flex-wrap: wrap; gap: 5px; }
  .seg button { margin: 0; font-size: 12px; padding: 5px 0; width: calc(50% - 3px); }
  .seg button.on { background: #2563eb; border-color: #2563eb; color: #fff; }
  .chk { display: flex; align-items: center; gap: 7px; margin-top: 8px;
         font-size: 11.5px; color: #8b9ab8; cursor: pointer; user-select: none; }
  .chk input { accent-color: #2dd4bf; width: 14px; height: 14px; }
  .hint { font-size: 11px; color: #566178; margin-top: 8px; line-height: 1.5; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #stage { flex: 1; display: grid; place-items: center; background: #05070d; min-height: 0; padding: 8px; }
  #wrap { width: 100%; height: 100%; display: grid; place-items: center; }
  #wrap > canvas { max-width: 100%; max-height: 100%; }
  canvas { max-width: 100%; max-height: 100%; display: block; image-rendering: auto;
           cursor: grab; touch-action: none; }
  canvas:active { cursor: grabbing; }

  /* 折叠按钮：桌面端跟着侧栏走，手机端固定在左上角 */
  #panelBtn {
    position: fixed; top: 10px; z-index: 70; width: 36px; height: 36px;
    display: grid; place-items: center; border-radius: 10px; cursor: pointer;
    border: 1px solid #232b3e; background: rgba(16,20,31,0.85); color: #dbe2f3;
    backdrop-filter: blur(6px); font-size: 15px; line-height: 1;
    left: 10px; transition: background .15s, transform .15s;
  }
  #panelBtn:hover { background: #1d2536; transform: scale(1.05); }
  body.panel-collapsed aside { display: none; }
  /* 桌面：侧栏占左侧 264px，按钮挪到它右边，不压标题 */
  @media (min-width: 821px) { #panelBtn { left: 276px; } }

  /* 手机上的遮罩 */
  #scrim { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 60; }

  @media (max-width: 820px) {
    aside {
      position: fixed; left: 0; top: 0; bottom: 0; z-index: 65;
      width: min(300px, 86vw);
      transform: translateX(-100%);
      transition: transform .22s ease;
      box-shadow: 8px 0 28px rgba(0,0,0,0.55);
    }
    body.panel-open aside { transform: none; }
    body.panel-open #scrim { display: block; }
    aside { padding-top: 52px; }   /* 给左上角按钮让位 */
    main { width: 100%; }
    #meta { font-size: 10px; }
    .metabar { gap: 8px; padding: 5px 10px; }
    .credit svg { width: 16px; height: 16px; }
  }
  .metabar { padding: 5px 12px;
             border-top: 1px solid #161c28; }
  #meta { flex: 1; min-width: 0; font-size: 11px; color: #566178;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }


  .about-meta { font-size: 11px; color: #6b7894; line-height: 1.6; }
  .about-tip { margin-top: 10px; color: #54607a; }
  .about-link {
    display: flex; align-items: center; gap: 9px; margin-top: 8px;
    padding: 9px 11px; border: 1px solid #232b3e; border-radius: 9px;
    background: #0f1420; color: #c3cee6; text-decoration: none; font-size: 12px;
    transition: border-color .15s, color .15s, background .15s;
  }
  .about-link:hover { border-color: #2f6f66; background: #101a22; color: #5eead4; }
  .about-link svg { width: 17px; height: 17px; flex: 0 0 auto; }
</style>
</head>
<body>

<button id="panelBtn" title="显示/隐藏设置面板" aria-label="设置面板">☰</button>

<aside>
  <h1>风洞实验室 v2</h1>

<script>
(() => {
  /* ================= 参数 ================= */
  // 构建时由 CI 替换成日期；本地直接打开时保持占位符，显示为「本地预览」
  const BUILD_DATE = '__BUILD_DATE__';
  const QS = new URLSearchParams(location.search);
  const RES = QS.get('res') || '320x180';
  let NX = parseInt(RES.split('x')[0], 10) || 320;
  let NY = parseInt(RES.split('x')[1], 10) || 180;
  const N = () => NX * NY;

  let speed = parseFloat(QS.get('speed') || '1.7') || 1.7;   // 0.2~4
  let visc  = parseFloat(QS.get('visc') || '0.06');       // 0~1
  let vortF = parseFloat(QS.get('vort') || '16');         // 涡量约束强度
  let life  = parseFloat(QS.get('life') || '1');         // 烟迹长度
  let bright = parseFloat(QS.get('bright') || '0.7');    // 流线/粒子亮度倍数
  let mode  = QS.get('mode') || 'stream';
  let frameNo = 0;
  const SHAPE = QS.get('shape') || 'circle';             // circle | airfoil | teardrop
  const STILL = parseInt(QS.get('still') || '0', 10);    // >0：跑固定帧后出静帧

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d', { alpha: false });
  const $ = (id) => document.getElementById(id);

  /* ================= 场 ================= */
  let u, v, u0, v0, p, div, curl, solid, img;
  // ── 多分辨率：物理网格 NX×NY，染料网格 DX×DY（= NX·DS × NY·DS）
  // 压力投影最贵，按低分辨率算；染料只做对流，按高分辨率算 → 又快又细
  let DS = Math.max(1, Math.min(3, parseInt(QS.get('ds') || '2', 10) || 2));
  let DX = 0, DY = 0;
  let dye, dyeTmp, solidD, dyeCv, dyeCtx;
  // 掩码按网格的 MS 倍栅格化，再用"覆盖率"决定格子算不算固体 ——
  // 否则 320×180 的格子会把天线、薄支架这种细节整个吃掉
  const MS = 4;
  let cov = null;          // 每个物理格被物体覆盖的比例 0..1
  let fineMask = null;     // 染料级的固体掩码（高精度）
  let baseCanvas = null;   // 导入的原图副本（方便重新处理）

  // 多重网格：粗层（2×2 合并）缓冲
  const MG = { ready: false, W: 0, H: 0, solid: null, p: null, div: null, res: null };
  // 多重网格目前是实验特性：收敛质量还打不过 20 次 Jacobi，默认关
  const useMG = QS.get('mg') === '1';
  let us, vs;          // 平滑后的速度场（仅用于流线积分，防止锯齿状抽动）
  let RS = 2;          // 渲染倍率（画布 = 网格 × RS）
  let fieldCv = null, fieldCtx = null;   // 标量场离屏画布
  let smokeCv = null, smokeCtx = null;   // 烟的累积层
  let srcImg = null;   // 用户上传的原图
  let objGeom = null;  // 物体在网格里的尺寸 { w, h }，渲染时用原图按画布像素画
  let maskImg = null;  // 图片贡献的实体掩码
  let paint = null;    // 手画的实体（画笔=1，橡皮=0）
  let tool = 'none';   // none | brush | eraser
  const SHAPE_NAMES = {
    circle: '圆柱', airfoil: '翼型', teardrop: '水滴',
    car: '汽车', rock: '岩石', twin: '双圆柱'
  };
  let bgTol = parseInt(QS.get('bgtol') || '26', 10) || 26;   // 抠背景容差
  let smokeHue = parseFloat(QS.get('hue') || '190');          // 烟色（HSL 色相）
  let inject = parseFloat(QS.get('inj') || '8');              // 每帧发射粒子数
  let particleRandom = QS.get('prand') !== '0';
  let particleTick = 0;
  let flowInited = false;
  let simT = 0;            // 模拟时间（秒），给入口扰动用  // 第一次建掩码要灌满均匀来流，之后拖动才不重置
  let brush = 4;       // 笔刷半径（格子）
  // 物体摆放：像真实风洞那样可以把模型挪来挪去、放大缩小、转个角度
  let objX = parseFloat(QS.get('ox') || '0.30');
  let objY = parseFloat(QS.get('oy') || '0.50');
  let objScale = parseFloat(QS.get('scale') || '1.0');
  let objAngle = parseFloat(QS.get('angle') || '0');

  function alloc() {
    const n = N();
    DX = NX * DS; DY = NY * DS;
    const nd = DX * DY;
    dye = new Float32Array(nd); dyeTmp = new Float32Array(nd);
    solidD = new Uint8Array(nd);

    u = new Float32Array(n); v = new Float32Array(n);
    u0 = new Float32Array(n); v0 = new Float32Array(n);
    p = new Float32Array(n); div = new Float32Array(n);
    curl = new Float32Array(n);
    solid = new Uint8Array(n);
    cov = new Float32Array(n);
    MG.ready = false;          // 尺寸变了，粗层要在用到时重建
    MG.res = new Float32Array(n);
    us = new Float32Array(n); vs = new Float32Array(n);
    maskImg = new Uint8Array(n); paint = new Uint8Array(n);
    // 渲染分辨率 = 网格 × RS。网格负责物理，RS 负责"线看起来细不细"
    // 渲染倍率 = 想要多少物理像素 / 网格宽。
    // 原来写死 1500，宽屏 + 高分屏下会不够，导致导入的图被二次放大变糊。
    const stageW = (document.getElementById('stage') || {}).clientWidth || 1000;
    const dpr = window.devicePixelRatio || 1;
    const targetW = Math.max(900, Math.min(2200, Math.round(stageW * dpr)));
    RS = Math.max(1, Math.min(6, Math.round(targetW / NX)));
    cv.width = NX * RS; cv.height = NY * RS;
    ctx.setTransform(RS, 0, 0, RS, 0, 0);

    // 标量场先画在网格分辨率上，再放大（开插值 → 平滑渐变，不是马赛克）
    fieldCv = document.createElement('canvas');
    fieldCv.width = NX; fieldCv.height = NY;
    fieldCtx = fieldCv.getContext('2d');

    // 染料单独一张高分辨率画布（条纹烟用）
    dyeCv = document.createElement('canvas');
    dyeCv.width = DX; dyeCv.height = DY;
    dyeCtx = dyeCv.getContext('2d');

    // 烟的累积层：不清屏，只慢慢淡出 → 天然带"烟"的柔边和层次
    smokeCv = document.createElement('canvas');
    smokeCv.width = NX * RS; smokeCv.height = NY * RS;
    smokeCtx = smokeCv.getContext('2d');
    smokeCtx.setTransform(RS, 0, 0, RS, 0, 0);
    smokeCtx.fillStyle = '#05070d';
    smokeCtx.fillRect(0, 0, NX, NY);

    fitCanvas();
  }

  /** 让画布在可用空间里尽量大（保持宽高比，不留黑边） */
  function fitCanvas() {
    const st = document.getElementById('stage');
    if (!st) return;
    const aw = Math.max(100, st.clientWidth - 16);
    const ah = Math.max(80, st.clientHeight - 16);
    const k = Math.min(aw / NX, ah / NY);
    cv.style.width = Math.floor(NX * k) + 'px';
    cv.style.height = Math.floor(NY * k) + 'px';
  }
  window.addEventListener('resize', () => fitCanvas());

  const at = (x, y) => y * NX + x;
  const atD = (x, y) => y * DX + x;
  const clampCellD = (x, y) => {
    x = x < 0 ? 0 : (x > DX - 1 ? DX - 1 : x);
    y = y < 0 ? 0 : (y > DY - 1 ? DY - 1 : y);
    return y * DX + x;
  };
  const clampCell = (x, y) => {
    x = x < 0 ? 0 : (x > NX - 1 ? NX - 1 : x);
    y = y < 0 ? 0 : (y > NY - 1 ? NY - 1 : y);
    return y * NX + x;
  };

  /* 基准风速：格子/秒 */
  const U0 = 52;

  /* ================= 初始化 ================= */
  function initFlow() {
    u.fill(0); v.fill(0); p.fill(0); dye.fill(0);
    // 均匀来流
    for (let y = 0; y < NY; y++) {
      for (let x = 0; x < NX; x++) {
        const i = at(x, y);
        if (!solid[i]) u[i] = U0 * speed;
      }
    }
    if (dye) dye.fill(0);
    seedDye();
    particles.length = 0;
  }

  /** 重新铺一遍条纹染料（物体挪动后必须重播，否则旧位置会留一个"黑洞"） */
  function seedDye() {
    const bandH = 14 * DS;                 // 条纹高度也要跟着放大
    for (let y = 0; y < DY; y++) {
      const band = Math.floor(y / bandH) % 2;
      for (let x = 0; x < DX; x++) {
        dye[atD(x, y)] = solidD[atD(x, y)] ? 0 : (band ? 1 : 0);
      }
    }
  }

  /* ================= 固体掩码 ================= */
  function applyMask(alphaAt, resetFlow = true) {
    solid.fill(0);
    for (let y = 0; y < NY; y++) {
      for (let x = 0; x < NX; x++) {
        if (alphaAt(x, y) > 100) solid[at(x, y)] = 1;
      }
    }
    // 膨胀一圈，避免气流从像素缝里钻
    const cp = solid.slice();
    for (let y = 1; y < NY - 1; y++) {
      for (let x = 1; x < NX - 1; x++) {
        const i = at(x, y);
        if (cp[i]) continue;
        if (cp[i - 1] || cp[i + 1] || cp[i - NX] || cp[i + NX]) solid[i] = 1;
      }
    }
    // 进出口/上下边界不算固体
    for (let y = 0; y < NY; y++) { solid[at(0, y)] = 0; solid[at(NX - 1, y)] = 0; }
    for (let x = 0; x < NX; x++) { solid[at(x, 0)] = 0; solid[at(x, NY - 1)] = 0; }
    if (maskImg) maskImg.set(solid);
    mergePaint();
    syncSolidFine();
    if (resetFlow) initFlow();
  }

  /** 图片掩码 + 手画掩码 合并；只改 solid，不重置流场（涂抹时流场要连续） */
  /**
   * 合成染料级固体：高精度掩码 ∪ 手画区域。
   * 没有高精度掩码时（老路径）退化成把粗网格上采样。
   */
  function syncSolidFine() {
    if (!solidD) return;
    if (!fineMask) {
      for (let y = 0; y < DY; y++) {
        const sy = (y / DS) | 0;
        for (let x = 0; x < DX; x++) {
          solidD[atD(x, y)] = solid[at((x / DS) | 0, sy)];
        }
      }
      return;
    }
    for (let y = 0; y < DY; y++) {
      const sy = (y / DS) | 0;
      for (let x = 0; x < DX; x++) {
        const cx = (x / DS) | 0;
        solidD[atD(x, y)] = (fineMask[atD(x, y)] || paint[at(cx, sy)]) ? 1 : 0;
      }
    }
  }

  function mergePaint() {
    if (!maskImg) return;
    for (let i = 0, n = NX * NY; i < n; i++) solid[i] = maskImg[i] | paint[i];
    for (let y = 0; y < NY; y++) { solid[at(0, y)] = 0; solid[at(NX - 1, y)] = 0; }
    for (let x = 0; x < NX; x++) { solid[at(x, 0)] = 0; solid[at(x, NY - 1)] = 0; }
    syncSolidFine();
  }

  /** 在 (gx,gy) 处涂抹/擦除 */
  function stamp(gx, gy) {
    const r = brush;
    const v = tool === 'brush' ? 1 : 0;
    for (let y = Math.max(1, gy - r); y <= Math.min(NY - 2, gy + r); y++) {
      for (let x = Math.max(1, gx - r); x <= Math.min(NX - 2, gx + r); x++) {
        if ((x - gx) * (x - gx) + (y - gy) * (y - gy) <= r * r) paint[at(x, y)] = v;
      }
    }
    mergePaint();
    seedDye();
    if (!flowInited) { initFlow(); flowInited = true; }
    resetSmoke();   // 否则涂抹处会留下旧流线，看起来像重影
  }

  /* ================= 半拉格朗日对流 ================= */
  /** 在粗网格上双线性插值原始速度（染料回退用） */
  function sampleUVCoarse(x, y, out) {
    if (x < 0) x = 0; if (y < 0) y = 0;
    if (x > NX - 1.001) x = NX - 1.001;
    if (y > NY - 1.001) y = NY - 1.001;
    const x0 = x | 0, y0 = y | 0;
    const fx = x - x0, fy = y - y0;
    const i00 = y0 * NX + x0;
    const i10 = i00 + 1, i01 = i00 + NX, i11 = i01 + 1;
    out[0] = (u[i00] * (1 - fx) + u[i10] * fx) * (1 - fy) +
             (u[i01] * (1 - fx) + u[i11] * fx) * fy;
    out[1] = (v[i00] * (1 - fx) + v[i10] * fx) * (1 - fy) +
             (v[i01] * (1 - fx) + v[i11] * fx) * fy;
  }

  /** 染料网格（DX×DY）上的双线性采样 */
  function bilerpD(f, x, y) {
    if (x < 0) x = 0; if (y < 0) y = 0;
    if (x > DX - 1.001) x = DX - 1.001;
    if (y > DY - 1.001) y = DY - 1.001;
    const x0 = x | 0, y0 = y | 0;
    const fx = x - x0, fy = y - y0;
    const i00 = y0 * DX + x0;
    const v00 = f[i00], v10 = f[i00 + 1];
    const v01 = f[i00 + DX], v11 = f[i00 + DX + 1];
    return (v00 * (1 - fx) + v10 * fx) * (1 - fy) +
           (v01 * (1 - fx) + v11 * fx) * fy;
  }

  function bilerp(f, x, y) {
    const x0 = Math.floor(x), y0 = Math.floor(y);
    const fx = x - x0, fy = y - y0;
    const i00 = clampCell(x0, y0), i10 = clampCell(x0 + 1, y0);
    const i01 = clampCell(x0, y0 + 1), i11 = clampCell(x0 + 1, y0 + 1);
    return (f[i00] * (1 - fx) + f[i10] * fx) * (1 - fy) +
           (f[i01] * (1 - fx) + f[i11] * fx) * fy;
  }

  function advect(dst, src, dt) {
    for (let y = 1; y < NY - 1; y++) {
      for (let x = 1; x < NX - 1; x++) {
        const i = at(x, y);
        if (solid[i]) { dst[i] = 0; continue; }
        const px = x - dt * u[i];
        const py = y - dt * v[i];
        dst[i] = bilerp(src, px, py);
      }
    }
  }

  /**
   * MacCormack / BFECC 对流：把半拉格朗日的数值耗散补回来。
   *
   * 思路（参考 APK 里 advect_*_warp 的做法）：
   *   ① 正推：phi1 = advect(phi, +dt)
   *   ② 反推：phi2 = advect(phi1, -dt)
   *   ③ 校正：phi_new = phi1 + 0.5*(phi - phi2)
   *   ④ 限幅：夹在 phi 的邻居最大/最小值之间（不夹会过冲、出条纹）
   *
   * 代价：一次对流变三次采样。所以只有 dye 用（视觉收益最大、场最小）。
   */
  let _mcTmp = null;
  function advectMC(dst, src, dt, W, H, sx, sy, bilerpFn, solidArr, idxAt) {
    if (!_mcTmp || _mcTmp.length < W * H) _mcTmp = new Float32Array(W * H);
    const tmp = _mcTmp;
    // ① 正推
    for (let y = 1; y < H - 1; y++) {
      for (let x = 1; x < W - 1; x++) {
        const i = idxAt(x, y);
        if (solidArr && solidArr[i]) { tmp[i] = 0; continue; }
        const px = x - dt * sx(x, y);
        const py = y - dt * sy(x, y);
        tmp[i] = bilerpFn(src, px, py);
      }
    }
    // ② 反推 + ③ 校正 + ④ 限幅
    for (let y = 1; y < H - 1; y++) {
      for (let x = 1; x < W - 1; x++) {
        const i = idxAt(x, y);
        if (solidArr && solidArr[i]) { dst[i] = 0; continue; }
        const px = x + dt * sx(x, y);
        const py = y + dt * sy(x, y);
        const back = bilerpFn(tmp, px, py);
        let val = tmp[i] + 0.5 * (src[i] - back);

        // 限幅：用源场的 4 邻居范围
        const a = src[i], b = src[i - 1], c = src[i + 1];
        const d0 = src[i - W], e0 = src[i + W];
        const lo = Math.min(a, b, c, d0, e0);
        const hi = Math.max(a, b, c, d0, e0);
        if (val < lo) val = lo; else if (val > hi) val = hi;
        dst[i] = val;
      }
    }
  }

  /* ================= 投影（去散度） ================= */
  /** 建粗层（2×2 合并）：solid 取"任意子是固体"，其余字段清零 */
  function mgBuild() {
    const W = Math.max(6, NX >> 1), H = Math.max(6, NY >> 1);
    MG.W = W; MG.H = H;
    MG.solid = new Uint8Array(W * H);
    MG.p = new Float32Array(W * H);
    MG.div = new Float32Array(W * H);
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const i = y * W + x;
        const cx = x << 1, cy = y << 1;
        let anySolid = 0;
        for (let dy = 0; dy < 2; dy++) {
          for (let dx = 0; dx < 2; dx++) {
            const xx = cx + dx, yy = cy + dy;
            if (xx >= NX || yy >= NY) continue;
            if (solid[yy * NX + xx]) anySolid = 1;
          }
        }
        MG.solid[i] = anySolid;
      }
    }
    MG.ready = true;
  }

  /** 细网格残差 r = div - laplacian(p) */
  function mgResidual() {
    const r = MG.res;
    for (let y = 1; y < NY - 1; y++) {
      for (let x = 1; x < NX - 1; x++) {
        const i = at(x, y);
        if (solid[i]) { r[i] = 0; continue; }
        const l = solid[i - 1] ? p[i] : p[i - 1];
        const rr = solid[i + 1] ? p[i] : p[i + 1];
        const bb = solid[i - NX] ? p[i] : p[i - NX];
        const tt = solid[i + NX] ? p[i] : p[i + NX];
        r[i] = div[i] - ((l + rr + bb + tt) - 4 * p[i]);
      }
    }
  }

  /** 限制：细网格残差 → 粗网格（4 格平均） */
  function mgRestrict() {
    const W = MG.W, H = MG.H;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const i = y * W + x;
        if (MG.solid[i]) { MG.div[i] = 0; continue; }
        let sum = 0, cnt = 0;
        const cx = x << 1, cy = y << 1;
        for (let dy = 0; dy < 2; dy++) {
          for (let dx = 0; dx < 2; dx++) {
            const xx = cx + dx, yy = cy + dy;
            if (xx >= NX || yy >= NY) continue;
            sum += MG.res[yy * NX + xx]; cnt++;
          }
        }
        MG.div[i] = cnt ? sum / cnt : 0;
        MG.p[i] = 0;
      }
    }
  }

  /** 粗层 Jacobi 光滑 */
  function mgSmoothCoarse(iters) {
    const W = MG.W, H = MG.H, P = MG.p, D = MG.div, S = MG.solid;
    for (let k = 0; k < iters; k++) {
      for (let y = 1; y < H - 1; y++) {
        for (let x = 1; x < W - 1; x++) {
          const i = y * W + x;
          if (S[i]) { P[i] = 0; continue; }
          const l = S[i - 1] ? P[i] : P[i - 1];
          const r = S[i + 1] ? P[i] : P[i + 1];
          const b = S[i - W] ? P[i] : P[i - W];
          const t = S[i + W] ? P[i] : P[i + W];
          P[i] = (D[i] + l + r + b + t) * 0.25;
        }
      }
    }
  }

  /** 延拓：粗层修正加到细网格 p 上（双线性） */
  function mgProlongAdd() {
    const W = MG.W, H = MG.H, P = MG.p;
    for (let y = 1; y < NY - 1; y++) {
      for (let x = 1; x < NX - 1; x++) {
        const i = at(x, y);
        if (solid[i]) continue;
        const gx = Math.min(W - 1.001, Math.max(0, x * 0.5));
        const gy = Math.min(H - 1.001, Math.max(0, y * 0.5));
        const x0 = gx | 0, y0 = gy | 0;
        const fx = gx - x0, fy = gy - y0;
        const i00 = y0 * W + x0;
        const v00 = P[i00], v10 = P[i00 + 1];
        const v01 = P[i00 + W], v11 = P[i00 + W + 1];
        const v = (v00 * (1 - fx) + v10 * fx) * (1 - fy) +
                  (v01 * (1 - fx) + v11 * fx) * fy;
        p[i] += v;
      }
    }
  }

  /** 细网格 Jacobi 光滑（和原来 project 里那段一致） */
  function mgSmoothFine(iters) {
    for (let k = 0; k < iters; k++) {
      for (let y = 1; y < NY - 1; y++) {
        for (let x = 1; x < NX - 1; x++) {
          const i = at(x, y);
          if (solid[i]) continue;
          const l = solid[i - 1] ? p[i] : p[i - 1];
          const r = solid[i + 1] ? p[i] : p[i + 1];
          const b = solid[i - NX] ? p[i] : p[i - NX];
          const t = solid[i + NX] ? p[i] : p[i + NX];
          p[i] = (div[i] + l + r + b + t) * 0.25;
        }
      }
    }
  }

  function project(iters) {
    const h = 1;   // 格子间距
    for (let y = 1; y < NY - 1; y++) {
      for (let x = 1; x < NX - 1; x++) {
        const i = at(x, y);
        if (solid[i]) { div[i] = 0; p[i] = 0; continue; }
        const l = solid[i - 1] ? u[i] : u[i - 1];
        const r = solid[i + 1] ? u[i] : u[i + 1];
        const b = solid[i - NX] ? v[i] : v[i - NX];
        const t = solid[i + NX] ? v[i] : v[i + NX];
        div[i] = -0.5 * h * ((r - l) + (t - b));
        p[i] = 0;
      }
    }
    // ── 多重网格 V 循环（对标参考 APK 的 prolong_pression / MGE 边界）──
    // 只做 Jacobi 的话，低频误差收敛极慢，只能靠堆迭代次数（很贵）。
    // 这里：细层光滑 → 限制残差到粗层 → 粗层多迭代（便宜）→ 延拓回细层 → 再光滑。
    if (!useMG) {
      for (let k = 0; k < iters; k++) {
        for (let y = 1; y < NY - 1; y++) {
          for (let x = 1; x < NX - 1; x++) {
            const i = at(x, y);
            if (solid[i]) continue;
            const l = solid[i - 1] ? p[i] : p[i - 1];
            const r = solid[i + 1] ? p[i] : p[i + 1];
            const b = solid[i - NX] ? p[i] : p[i - NX];
            const t = solid[i + NX] ? p[i] : p[i + NX];
            p[i] = (div[i] + l + r + b + t) * 0.25;
          }
        }
      }
    } else {
    if (!MG.ready) mgBuild();
    for (let vc = 0; vc < 2; vc++) {
      mgSmoothFine(Math.max(5, iters >> 2));     // 细层预光滑
      mgResidual();                               // r = div - ∇²p
      mgRestrict();                               // 粗层残差
      mgSmoothCoarse(Math.max(12, iters));        // 粗层求解（1/4 代价）
      mgProlongAdd();                             // 修正回细层
      mgSmoothFine(Math.max(6, iters >> 2));      // 细层后光滑
    }
    }
    for (let y = 1; y < NY - 1; y++) {
      for (let x = 1; x < NX - 1; x++) {
        const i = at(x, y);
        if (solid[i]) continue;
        const l = solid[i - 1] ? p[i] : p[i - 1];
        const r = solid[i + 1] ? p[i] : p[i + 1];
        const b = solid[i - NX] ? p[i] : p[i - NX];
        const t = solid[i + NX] ? p[i] : p[i + NX];
        u[i] -= 0.5 * (r - l) / h;
        v[i] -= 0.5 * (t - b) / h;
      }
    }
  }

  /* ================= 涡量 + 涡量约束 ================= */
  function computeCurl() {
    for (let y = 1; y < NY - 1; y++) {
      for (let x = 1; x < NX - 1; x++) {
        const i = at(x, y);
        if (solid[i]) { curl[i] = 0; continue; }
        curl[i] = 0.5 * ((v[i + 1] - v[i - 1]) - (u[i + NX] - u[i - NX]));
      }
    }
  }

  function vorticityConfinement(dt) {
    if (vortF <= 0) return;
    for (let y = 2; y < NY - 2; y++) {
      for (let x = 2; x < NX - 2; x++) {
        const i = at(x, y);
        if (solid[i]) continue;
        const gx = Math.abs(curl[i + 1]) - Math.abs(curl[i - 1]);
        const gy = Math.abs(curl[i + NX]) - Math.abs(curl[i - NX]);
        const len = Math.hypot(gx, gy) + 1e-5;
        const nx = gx / len, ny = gy / len;
        u[i] += vortF * dt * (ny * curl[i]);
        v[i] += vortF * dt * (-nx * curl[i]);
      }
    }
  }

  /* ================= 气动力（尾流动量亏损法） ================= */
  /*
   * 为什么不用"对固体表面压力积分"：
   *   Stam 求解器里的 p 是"伪压力"（只保证梯度正确，绝对值没有物理单位），
   *   直接积分出来的数完全没有量级意义（实测算出 Cd=1245）。
   *
   * 改用风洞实验里真实在用的做法 —— 在物体下游量一条竖线上的动量亏损：
   *   F_drag ≈ ∫ ρ·u·(U − u) dy
   *   F_lift ≈ ∫ ρ·u·v      dy
   * 再除以 0.5·ρ·U²·H（H = 物体的迎风高度）得到系数。
   * 这样得到的 Cd 在 0.5~2 量级，和教科书对得上。
   */
  let clNow = 0, cdNow = 0;
  function computeForces() {
    const U = U0 * speed;
    if (U <= 0) { clNow = 0; cdNow = 0; return; }

    // 物体在竖直方向占多少格（迎风高度）
    let minY = NY, maxY = 0, minX = NX, maxX = 0;
    for (let y = 1; y < NY - 1; y++) {
      for (let x = 1; x < NX - 1; x++) {
        if (solid[at(x, y)]) {
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
        }
      }
    }
    const H = Math.max(4, maxY - minY + 1);
    if (maxX <= minX) { clNow = 0; cdNow = 0; return; }

    // 测量线：物体后缘再往下游一点（避开物体本身和近尾流奇点）
    const xw = Math.min(NX - 3, Math.max(minX + 2, maxX + Math.round(H * 0.6)));

    let drag = 0, lift = 0;
    for (let y = 1; y < NY - 1; y++) {
      const i = at(xw, y);
      if (solid[i]) continue;
      const uu = us[i] || 0, vv = vs[i] || 0;
      drag += uu * (U - uu);
      lift += uu * vv;
    }
    const ref = 0.5 * U * U * H;
    cdNow = drag / ref;
    clNow = lift / ref;
  }

  /* ================= 边界 ================= */
  function applyBoundary() {
    const U = U0 * speed;
    // 入口给一个很轻的上下摆动（幅度 3%）。
    // 完全对称的入口会让流场一直保持对称，物体后面永远不脱涡 ——
    // 真实风洞里这点扰动来自来流的湍流度。
    const wobble = 0.03 * U * Math.sin(simT * 2.4) + 0.015 * U * Math.sin(simT * 6.7);
    for (let y = 1; y < NY - 1; y++) {
      const i = at(0, y);
      if (!solid[i]) { u[i] = U; v[i] = wobble; }
      const r = at(NX - 1, y);
      const a = at(NX - 2, y);
      u[r] = u[a]; v[r] = v[a];
    }
    for (let x = 0; x < NX; x++) {
      u[at(x, 0)] = u[at(x, 1)]; v[at(x, 0)] = 0;
      u[at(x, NY - 1)] = u[at(x, NY - 2)]; v[at(x, NY - 1)] = 0;
    }
    // 固体内部速度为 0；贴着固体的格子加摩擦
    for (let y = 1; y < NY - 1; y++) {
      for (let x = 1; x < NX - 1; x++) {
        const i = at(x, y);
        if (solid[i]) { u[i] = 0; v[i] = 0; continue; }
        // 边缘格（覆盖率 0.15~0.5）：按覆盖比例削弱速度，
        // 这样物体轮廓是"半透"的，气流不会从笔画缝里直穿
        if (cov && cov[i] > 0.15) {
          const k = 1 - 0.55 * cov[i];
          u[i] *= k; v[i] *= k;
        }
        if (solid[i - 1] || solid[i + 1] || solid[i - NX] || solid[i + NX]) {
          const f = 0.96 - 0.03 * (1 - visc);
          u[i] *= f; v[i] *= f;
        }
      }
    }
  }

  /* ================= 推进一帧 ================= */
  const dt = 1 / 60;
  function advance() {
    simT += dt;
    computeCurl();
    vorticityConfinement(dt);

    // 对流（半拉格朗日）
    u0.set(u); v0.set(v);
    advect(u, u0, dt);
    advect(v, v0, dt);

    // 投影
    project(20);

    // 边界
    applyBoundary();

    // ── 染料对流（高分辨率网格）──────────────────────────────
    // 速度场是粗网格的；细网格回退时要把"粗格/秒"换成"细格/秒"，所以乘 DS。
    // 采样用 sampleUF（已经过空间平滑 + 时间低通），比直接读 u/v 稳。
    // 染料：MacCormack（误差补偿）→ 涡丝更锐、不发糊
    dyeTmp.set(dye);
    advectMC(dye, dyeTmp, dt, DX, DY,
      // 细网格 x 方向的速度（粗格/秒 → 细格/秒）
      (x, y) => { const c = x / DS, d0 = y / DS; sampleUVCoarse(c, d0, _s1); return _s1[0] * DS; },
      (x, y) => { const c = x / DS, d0 = y / DS; sampleUVCoarse(c, d0, _s1); return _s1[1] * DS; },
      bilerpD, solidD, atD);
    for (let i = 0, n = DX * DY; i < n; i++) dye[i] *= 0.998;
    // 入口持续注入条纹（细网格）
    const bandH = 14 * DS;
    for (let y = 1; y < DY - 1; y++) {
      const band = Math.floor(y / bandH) % 2;
      dye[atD(0, y)] = band ? 1 : 0;
      dye[atD(1, y)] = band ? 1 : 0;
    }
  }

  /* ================= 粒子（脉线用） ================= */
  const particles = [];

  function spawnParticles() {
    const want = Math.max(1, Math.round(inject));
    for (let k = 0; k < want; k++) {
      // setRandom：按"随机 / 均匀"决定发射位置的纵向分布
      const y = particleRandom
        ? 2 + Math.random() * (NY - 4)
        : 2 + ((particleTick++ * 7) % Math.max(1, NY - 4));
      particles.push({
        x: 1 + Math.random(),
        y,
        age: 0,
        max: (1.2 + Math.random() * 1.6) * life
      });
    }
    if (particles.length > 4000) particles.splice(0, particles.length - 4000);
  }

  function stepParticles() {
    for (let k = particles.length - 1; k >= 0; k--) {
      const q = particles[k];
      const i = clampCell(q.x | 0, q.y | 0);
      if (solid[i]) { particles.splice(k, 1); continue; }
      q.x += u[i] * dt;
      q.y += v[i] * dt;
      q.age += dt;
      if (q.age > q.max || q.x > NX - 2 || q.y < 1 || q.y > NY - 2) particles.splice(k, 1);
    }
  }

  /* ================= 渲染 ================= */
  /**
   * 流线用的速度场：空间（5×5）+ 时间（低通）双重平滑。
   * 为什么两层都要：
   *   · 空间平滑去掉格子尺度的毛刺（涡量约束会放大它）
   *   · 时间低通去掉"每帧方向微微不同"造成的抖动 —— 这才是"抽搐"的主因
   * 这个场只用于画线，物理仍用原始 u/v。
   */
  const _tu = new Float32Array(1);
  function smoothVel() {
    const R = 3;   // 7×7（越快越乱，给足平滑）
    // 注意：要覆盖到 1..NX-2（包括边界那一圈），否则种子点读到 0 会立刻断线
    for (let y = 1; y < NY - 1; y++) {
      for (let x = 1; x < NX - 1; x++) {
        const i = at(x, y);
        if (solid[i]) { us[i] = 0; vs[i] = 0; continue; }
        let su = 0, sv = 0, n = 0;
        for (let dy = -R; dy <= R; dy++) {
          for (let dx = -R; dx <= R; dx++) {
            const xx = x + dx, yy = y + dy;
            if (xx < 0 || xx >= NX || yy < 0 || yy >= NY) continue;
            const j = yy * NX + xx;
            if (solid[j]) continue;
            su += u[j]; sv += v[j]; n++;
          }
        }
        if (!n) { us[i] = 0; vs[i] = 0; continue; }
        const nu = su / n, nv = sv / n;
        // 时间低通：0.72 旧 + 0.28 新（越小越稳、越大越跟手）
        us[i] = us[i] * 0.85 + nu * 0.15;
        vs[i] = vs[i] * 0.85 + nv * 0.15;
      }
    }
  }

  function sampleUF(x, y, out) {
    const x0 = Math.floor(x), y0 = Math.floor(y);
    const fx = x - x0, fy = y - y0;
    const i00 = clampCell(x0, y0), i10 = clampCell(x0 + 1, y0);
    const i01 = clampCell(x0, y0 + 1), i11 = clampCell(x0 + 1, y0 + 1);
    out[0] = (us[i00] * (1 - fx) + us[i10] * fx) * (1 - fy) +
             (us[i01] * (1 - fx) + us[i11] * fx) * fy;
    out[1] = (vs[i00] * (1 - fx) + vs[i10] * fx) * (1 - fy) +
             (vs[i01] * (1 - fx) + vs[i11] * fx) * fy;
  }

  const seedsRows = 30;
  const _s1 = [0, 0], _s2 = [0, 0];
  function drawStreamlines(g, alpha) {
    const Hh = 0.7;                       // 步长更小，曲线更顺
    const MAXSTEP = Math.ceil(NX * 1.8 / Hh);
    // 烟感关键：线细一点、透明度低一点、加辉光 → 叠起来像烟，不像钢笔线
    // 线宽要按 RS 反算，否则 RS=4 时线是 3.2 像素，看起来又粗又糊
    g.lineWidth = Math.max(0.22, 1.1 / RS);
    g.lineJoin = 'round';
    g.lineCap = 'round';
    // 注意：shadowBlur 是逐条 stroke 的高开销特效，
    // 手机上几十条线每帧都模糊一遍 = 直接掉帧。改用双层描边模拟辉光。
    g.shadowBlur = 0;

    // 种子 ①：入口
    const seeds = [];
    for (let s = 0; s < seedsRows; s++) {
      seeds.push([3, 2.5 + s * (NY - 5) / (seedsRows - 1)]);
    }
    // 种子 ②：全场稀疏网格 —— 尾流区靠这些线才能"看得见"
    const stepX = Math.max(18, Math.round(NX / 10));
    const stepY = Math.max(12, Math.round(NY / 9));
    for (let y = stepY; y < NY - 3; y += stepY) {
      for (let x = stepX; x < NX - 3; x += stepX) {
        seeds.push([x, y]);
      }
    }

    for (let si = 0; si < seeds.length; si++) {
      let x = seeds[si][0], y = seeds[si][1];
      if (solid[clampCell(x | 0, y | 0)]) continue;
      g.beginPath();
      g.moveTo(x, y);
      let px = x, py = y;
      let _lastDx = 1, _lastDy = 0;
      for (let k = 0; k < MAXSTEP; k++) {
        // RK2（中点法）：先取当前点速度，走半步再取一次，能明显减少"折线感"
        sampleUF(x, y, _s1);
        let sp1 = Math.hypot(_s1[0], _s1[1]);
        if (sp1 < 0.06) { window.__b_sp = (window.__b_sp || 0) + 1; break; }  // 低速别急着断线，否则涡心进不去
        sampleUF(x + (_s1[0] / sp1) * Hh * 0.5, y + (_s1[1] / sp1) * Hh * 0.5, _s2);
        let sp2 = Math.hypot(_s2[0], _s2[1]);
        if (sp2 < 0.3) break;
        // 限制每步转角：速度场再抖，线本身也不会拐出折角
        let dx = (_s2[0] / sp2) * Hh, dy = (_s2[1] / sp2) * Hh;
        if (k > 0) {
          const maxTurn = 0.07;   // 弧度，≈4°（越严越不容易出现折角）
          const a0 = Math.atan2(_lastDy, _lastDx);
          const a1 = Math.atan2(dy, dx);
          let d = a1 - a0;
          while (d > Math.PI) d -= Math.PI * 2;
          while (d < -Math.PI) d += Math.PI * 2;
          const cl = Math.max(-maxTurn, Math.min(maxTurn, d));
          const a = a0 + cl, len = Math.hypot(dx, dy);
          dx = Math.cos(a) * len; dy = Math.sin(a) * len;
        }
        _lastDx = dx; _lastDy = dy;
        x += dx; y += dy;
        if (x < 1 || x > NX - 1 || y < 1 || y > NY - 2) { window.__b_bd = (window.__b_bd || 0) + 1; break; }
        if (solid[clampCell(x | 0, y | 0)]) { window.__b_sd = (window.__b_sd || 0) + 1; break; }
        g.lineTo(x, y);
        window.__pts = (window.__pts || 0) + 1;
      }
      const t = Math.min(1, (si % seedsRows) / (seedsRows - 1));
      g.strokeStyle = `rgba(${(90 + 50 * t) | 0},${(200 - 30 * t) | 0},252,${alpha})`;
      g.stroke();
    }
    g.shadowBlur = 0;
  }

  function drawParticles(g, alpha) {
    for (const q of particles) {
      const i = clampCell(q.x | 0, q.y | 0);
      const sp = Math.hypot(u[i], v[i]) / (U0 * speed || 1);
      const gg = 160 + 80 * Math.min(1, sp);
      g.fillStyle = `rgba(140,${gg | 0},255,${alpha})`;
      g.fillRect(q.x, q.y, Math.max(0.6, 1.4 / RS), Math.max(0.6, 1.4 / RS));
    }
  }

  /** 条纹烟：在染料网格（DX×DY）上上色，再平滑放大到画布 */
  function drawDye() {
    const id = dyeCtx.createImageData(DX, DY);
    const d = id.data;
    for (let i = 0, n = DX * DY; i < n; i++) {
      let r, g, b;
      if (solidD[i]) { r = 26; g = 30; b = 42; }
      else {
        const t = Math.max(0, Math.min(1, dye[i]));
        // HSL → RGB：色相可调，明度随染料浓度上升
        const hh = smokeHue / 360, ss = 0.42, ll = 0.08 + 0.74 * t;
        const q = ll < 0.5 ? ll * (1 + ss) : ll + ss - ll * ss;
        const pp = 2 * ll - q;
        const hue2rgb = (t1, t2, t3) => {
          if (t3 < 0) t3 += 1; if (t3 > 1) t3 -= 1;
          if (t3 * 6 < 1) return t1 + (t2 - t1) * 6 * t3;
          if (t3 * 2 < 1) return t2;
          if (t3 * 3 < 2) return t1 + (t2 - t1) * (2 / 3 - t3) * 6;
          return t1;
        };
        r = Math.round(hue2rgb(pp, q, hh + 1 / 3) * 255);
        g = Math.round(hue2rgb(pp, q, hh) * 255);
        b = Math.round(hue2rgb(pp, q, hh - 1 / 3) * 255);
      }
      const q = i * 4;
      d[q] = r; d[q + 1] = g; d[q + 2] = b; d[q + 3] = 255;
    }
    dyeCtx.putImageData(id, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(dyeCv, 0, 0, NX, NY);
  }

  function drawField() {
    const id = fieldCtx.createImageData(NX, NY);
    const d = id.data;
    for (let i = 0, n = NX * NY; i < n; i++) {
      let r, g, b;
      if (solid[i]) { r = 26; g = 30; b = 42; }
      else if (mode === 'stripes') {
        const t = Math.max(0, Math.min(1, dye[i]));
        // 蓝青 → 白，模仿风洞里被拉长的烟带
        r = 30 + 200 * t; g = 90 + 165 * t; b = 140 + 115 * t;
      } else if (mode === 'curl') {
        const t = Math.max(-1, Math.min(1, curl[i] / 40));
        if (t > 0) { r = 30 + 225 * t; g = 40 + 60 * t; b = 60 + 40 * (1 - t); }
        else { const a = -t; r = 30 + 30 * (1 - a); g = 50 + 120 * a; b = 90 + 165 * a; }
      } else if (mode === 'speed') {
        const t = Math.min(1, Math.hypot(u[i], v[i]) / (U0 * speed * 1.6));
        r = 30 + 225 * t; g = 70 + 150 * t * t; b = 210 - 120 * t;
      } else { // pressure
        const t = Math.min(1, Math.max(0, p[i] * 0.6 + 0.5));
        r = 60 + 195 * t; g = 90 + 60 * t; b = 210 - 150 * t;
      }
      const q = i * 4;
      d[q] = r; d[q + 1] = g; d[q + 2] = b; d[q + 3] = 255;
    }
    fieldCtx.putImageData(id, 0, 0);
    // 关键：放大时开启平滑，得到渐变而不是马赛克
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(fieldCv, 0, 0, NX, NY);
  }

  function drawFieldMode() {
    if (mode === 'stripes') drawDye(); else drawField();
  }

  /**
   * 直接拿「原图」在画布像素坐标系里画物体 —— 不经过任何中间缩放，
   * 所以 1200×675 的图显示出来就是 1200 宽级别的清晰度。
   */
  function drawObject() {
    if (!srcImg || !objGeom) return;
    const k = RS;                       // 画布像素 / 网格单元
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0); // 切到物理像素坐标
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.globalAlpha = 0.95;
    ctx.translate(objX * NX * k, objY * NY * k);
    ctx.rotate(objAngle * Math.PI / 180);
    ctx.drawImage(srcImg, -objGeom.w / 2 * k, -objGeom.h / 2 * k,
                  objGeom.w * k, objGeom.h * k);
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function render(fade) {
    if (mode === 'stream') {
      // 累积层：只淡出一部分，不清零 —— 多次叠加后就有烟的层次和柔边
      smokeCtx.globalCompositeOperation = 'source-over';
      // 拖动时把淡出加快（0.06 → 0.22）：既不留下明显重影，也不会把轨迹整片抹掉
      smokeCtx.fillStyle = dragging ? 'rgba(5,7,13,0.22)' : 'rgba(5,7,13,0.06)';
      smokeCtx.fillRect(0, 0, NX, NY);
      smokeCtx.globalCompositeOperation = 'lighter';
      drawStreamlines(smokeCtx, 0.13 * bright);

      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#05070d'; ctx.fillRect(0, 0, NX, NY);
      ctx.drawImage(smokeCv, 0, 0, NX, NY);
    } else if (mode === 'streak') {
      // 和流线一样分层：粒子只往累积层里画，主画布每帧重铺背景 + 物体
      smokeCtx.globalCompositeOperation = 'source-over';
      smokeCtx.fillStyle = `rgba(5,7,13,${0.035})`;
      smokeCtx.fillRect(0, 0, NX, NY);
      smokeCtx.globalCompositeOperation = 'lighter';
      drawParticles(smokeCtx, 0.25 * bright);

      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#05070d';
      ctx.fillRect(0, 0, NX, NY);
      ctx.drawImage(smokeCv, 0, 0, NX, NY);
    } else {
      drawFieldMode();
      if (mode === 'curl') {
        ctx.globalAlpha = 0.35;
        drawStreamlines(ctx, 0.5 * bright);
        ctx.globalAlpha = 1;
      }
    }
    // 入口提示
    ctx.fillStyle = 'rgba(94,234,212,0.14)';
    ctx.fillRect(0, 0, 1, NY);
    drawObject();

    // 拖动时给个虚线框：让"可拖区域"和实际位置一眼对得上
    if (dragging && objGeom) {
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.strokeStyle = 'rgba(94,234,212,0.85)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([6, 5]);
      ctx.translate(objX * NX * RS, objY * NY * RS);
      ctx.rotate(objAngle * Math.PI / 180);
      ctx.strokeRect(-objGeom.w / 2 * RS, -objGeom.h / 2 * RS,
                     objGeom.w * RS, objGeom.h * RS);
      ctx.restore();
    }
  }

  /* ================= 内置形状 ================= */
  function makeDemo() {
    const c = document.createElement('canvas');
    c.width = NX; c.height = NY;
    const g = c.getContext('2d');
    g.clearRect(0, 0, NX, NY);
    g.fillStyle = '#e2e8f0';
    const cx = NX * 0.28, cy = NY * 0.5, R = NY * 0.10;
    const SH = window.__shape || 'circle';
    if (SH === 'car') {
      // 侧视汽车：车身 + 车顶 + 两个轮子（轮子画成实心，气流绕不过去）
      const L = R * 3.4, H = R * 1.0;
      g.beginPath();
      g.moveTo(cx - L * 0.5, cy + H * 0.35);
      g.lineTo(cx - L * 0.45, cy - H * 0.15);
      g.lineTo(cx - L * 0.20, cy - H * 0.20);
      g.lineTo(cx - L * 0.05, cy - H * 0.95);   // 车顶前柱
      g.lineTo(cx + L * 0.22, cy - H * 0.95);   // 车顶
      g.lineTo(cx + L * 0.34, cy - H * 0.20);   // 后风挡
      g.lineTo(cx + L * 0.48, cy + H * 0.10);   // 车尾
      g.lineTo(cx + L * 0.46, cy + H * 0.35);
      g.closePath();
      g.fill();
      g.beginPath(); g.arc(cx - L * 0.28, cy + H * 0.42, R * 0.30, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.arc(cx + L * 0.28, cy + H * 0.42, R * 0.30, 0, Math.PI * 2); g.fill();
    } else if (SH === 'rock') {
      // 不平整的岩石：用固定随机数生成一圈半径起伏的多边形
      let seed = 12345;
      const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
      g.beginPath();
      const N = 26;
      for (let k = 0; k < N; k++) {
        const a = k / N * Math.PI * 2;
        const rr = R * (0.85 + 0.55 * rnd()) * (1 + 0.15 * Math.cos(a * 3));
        const px = cx + Math.cos(a) * rr * 1.35;
        const py = cy + Math.sin(a) * rr * 0.95;
        if (k === 0) g.moveTo(px, py); else g.lineTo(px, py);
      }
      g.closePath();
      g.fill();
    } else if (SH === 'twin') {
      // 两个圆柱串联：最容易看出卡门涡街
      g.beginPath(); g.arc(cx, cy, R * 0.75, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.arc(cx + R * 2.6, cy, R * 0.75, 0, Math.PI * 2); g.fill();
    } else if (SH === 'airfoil') {
      g.beginPath();
      g.ellipse(cx, cy, R * 3.0, R * 0.42, -0.10, 0, Math.PI * 2);
      g.fill();
    } else if (SH === 'teardrop') {
      g.beginPath();
      g.arc(cx, cy, R, Math.PI * 0.5, Math.PI * 1.5);
      g.lineTo(cx + R * 3, cy);
      g.closePath();
      g.fill();
    } else {
      g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.fill();
    }
    return c;
  }

  /** 把 source 画布按 objX/objY/objScale/objAngle 摆到网格画布上，再取 alpha 当掩码 */
  function rebuildObject() {
    if (!srcImg) return;

    // 等比缩放到网格（长边占 85%）
    const fit = Math.min(NX * 0.9 / srcImg.width, NY * 0.9 / srcImg.height);
    const w = srcImg.width * fit * objScale;
    const h = srcImg.height * fit * objScale;

    // 只把「中心点」限制在画布内：大图允许探出去（想完整看就缩小），
    // 否则一张宽图会把可拖动范围压成中间一窄条
    objX = Math.min(0.98, Math.max(0.02, objX));
    objY = Math.min(0.98, Math.max(0.02, objY));

    // 只存"摆好位置后的网格尺寸几何参数"，渲染时用原图直接画（见 drawObject）
    objGeom = { w, h };

    // ①②③ 三套光栅化：
    //   粗（NX×NY）   —— 给 UI 一个缩略图
    //   超采样（MS×）  —— 算每个格子的覆盖率，边缘才是抗锯齿的
    //   染料级（DS×）  —— 细网格的固体，保留细节
    const needInit = !flowInited;
    rasterizeMask(w, h, needInit);
    flowInited = true;
  }

  /** 把源图按当前变换光栅化到三套网格，并写入 solid / cov / solidD */
  function rasterizeMask(w, h, needInit) {
    const MX = NX * MS, MY = NY * MS;

    // ── 超采样画布：算覆盖率 ──
    const hc = document.createElement('canvas');
    hc.width = MX; hc.height = MY;
    const hg = hc.getContext('2d');
    hg.clearRect(0, 0, MX, MY);
    hg.save();
    hg.scale(MS, MS);                                  // 之后按网格坐标画
    hg.translate(objX * NX, objY * NY);
    hg.rotate(objAngle * Math.PI / 180);
    hg.drawImage(srcImg, -w / 2, -h / 2, w, h);
    hg.restore();

    const hi = hg.getImageData(0, 0, MX, MY).data;
    const coverAt = (x, y) => hi[((y | 0) * MX + (x | 0)) * 4 + 3] / 255;

    // ── 粗网格：块内平均覆盖率 ──
    const n = NX * NY;
    const covMask = new Float32Array(n);
    const inv = 1 / (MS * MS);
    for (let y = 0; y < NY; y++) {
      for (let x = 0; x < NX; x++) {
        let sum = 0;
        for (let dy = 0; dy < MS; dy++) {
          const yy = y * MS + dy;
          for (let dx = 0; dx < MS; dx++) sum += coverAt(x * MS + dx, yy);
        }
        covMask[at(x, y)] = sum * inv;
      }
    }

    // ── 细网格（染料级）：直接按中心点采样，保留薄结构 ──
    const fine = new Uint8Array(DX * DY);
    for (let y = 0; y < DY; y++) {
      const sy = (y / DS) * MS + MS * 0.5;              // 细格中心 → 超采样坐标
      for (let x = 0; x < DX; x++) {
        const sx = (x / DS) * MS + MS * 0.5;
        fine[atD(x, y)] = coverAt(sx, sy) > 0.5 ? 1 : 0;
      }
    }
    solidDFromFine(fine);
    cov = covMask;
    if (!solid) solid = new Uint8Array(n);
    updateSolidFromCov();
    if (!maskImg) maskImg = new Uint8Array(n);
    maskImg.set(solid);
    mergePaint();
    if (needInit) initFlow();
  }

  function solidDFromFine(fine) {
    fineMask = fine;
    solidD = fine.slice();
  }

  /** 覆盖率 > 0.5 算固体；0.15~0.5 是"边缘格"，速度要被削弱而不是硬挡 */
  function updateSolidFromCov() {
    for (let i = 0, n = NX * NY; i < n; i++) {
      solid[i] = (cov[i] > 0.5 || paint[i]) ? 1 : 0;
    }
    for (let y = 0; y < NY; y++) { solid[at(0, y)] = 0; solid[at(NX - 1, y)] = 0; }
    for (let x = 0; x < NX; x++) { solid[at(x, 0)] = 0; solid[at(x, NY - 1)] = 0; }
  }

  /** 把烟的累积层擦回背景色 */
  function resetSmoke() {
    if (!smokeCtx) return;
    smokeCtx.save();
    smokeCtx.setTransform(1, 0, 0, 1, 0, 0);
    smokeCtx.globalCompositeOperation = 'source-over';
    smokeCtx.fillStyle = '#05070d';
    smokeCtx.fillRect(0, 0, smokeCv.width, smokeCv.height);
    smokeCtx.restore();
  }

  function loadFromCanvas(c) {
    srcImg = c;
    rebuildObject();
  }

  /** 画一个内置形状并应用（同时把物体摆到默认位置） */
  function drawBuiltin(shape) {
    window.__shape = shape;
    if (!QS.has('ox')) objX = 0.30;
    if (!QS.has('oy')) objY = 0.50;
    if (!QS.has('scale')) objScale = 1.0;
    if (!QS.has('angle')) objAngle = 0;
    const c = makeDemo();
    loadFromCanvas(c);
    syncObjUI();
    $('meta').textContent = `内置形状：${SHAPE_NAMES[shape]} · 网格 ${NX}×${NY}`;
  }

  /** 静帧模式下图片可能是异步加载的，加载完要补渲染 */
  function rerenderIfStill() {
    if (!(STILL > 0)) return;
    const need = STILL;
    for (let k = 0; k < need; k++) { advance(); spawnParticles(); stepParticles(); }
    computeCurl();
    for (let k = 0; k < 12; k++) smoothVel();
    computeForces();
    for (let k = 0; k < 6; k++) render(0.03);
  }

  /** 从 URL 加载图片（?img=test.png） */
  function useImageURL(url) {
    const im = new Image();
    im.crossOrigin = 'anonymous';
    im.onload = () => {
      const c = document.createElement('canvas');
      c.width = im.naturalWidth; c.height = im.naturalHeight;
      c.getContext('2d').drawImage(im, 0, 0);
      baseCanvas = c;
      baseName = url;
      reprocessImage();
      rerenderIfStill();
    };
    im.onerror = () => { $('meta').textContent = '图片加载失败: ' + url; };
    im.src = url;
  }

  /**
   * 自动抠背景：从四条边泛洪，把和边缘颜色接近的像素设成透明。
   *
   * 为什么需要：很多 PNG 是"整块深色背景 + 车"，
   * 直接用 alpha 当掩码就会变成一个矩形，气流全被挡住 ——
   * 表现就是"纯色块""车头前方气流空白"。
   */
  function stripBackground(canvas, tol) {
    const g = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const id = g.getImageData(0, 0, W, H);
    const d = id.data;
    tol = tol || 26;

    // 背景色 = 四角 + 四边中点的中位数
    const pick = [];
    for (const [x, y] of [[0,0],[W-1,0],[0,H-1],[W-1,H-1],[W>>1,0],[W>>1,H-1],[0,H>>1],[W-1,H>>1]]) {
      const q = (y * W + x) * 4;
      pick.push([d[q], d[q+1], d[q+2]]);
    }
    pick.sort((a, b) => (a[0]+a[1]+a[2]) - (b[0]+b[1]+b[2]));
    const bg = pick[pick.length >> 1];

    const dist2 = (q) => {
      const dr = d[q] - bg[0], dg = d[q+1] - bg[1], db = d[q+2] - bg[2];
      return dr*dr + dg*dg + db*db;
    };
    const T2 = tol * tol;

    // 关键防误删：如果某个像素在**任意方向**上紧挨着与背景色差很多的像素，
    // 说明它挨着物体轮廓（或本身就是细结构），一律不删。
    // 之前没有这一步，深色车身上的天线、轮毂边这种"和背景同色又连着物体"的地方会被吃掉。
    const edgeGuard = new Uint8Array(W * H);
    const EDGE2 = (tol * 2.2) * (tol * 2.2);
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const idx = y * W + x, q = idx * 4;
        if (dist2(q) > T2) continue;                 // 本来就不是背景色，不管
        let guard = false;
        for (let dy = -1; dy <= 1 && !guard; dy++) {
          const yy = y + dy; if (yy < 0 || yy >= H) continue;
          for (let dx = -1; dx <= 1; dx++) {
            const xx = x + dx; if (xx < 0 || xx >= W) continue;
            if (dx === 0 && dy === 0) continue;
            const qq = (yy * W + xx) * 4;
            if (dist2(qq) > EDGE2) { guard = true; break; }
          }
        }
        if (guard) edgeGuard[idx] = 1;
      }
    }

    // 从四边泛洪
    const seen = new Uint8Array(W * H);
    const stack = [];
    for (let x = 0; x < W; x++) { stack.push(x); stack.push((H - 1) * W + x); }
    for (let y = 0; y < H; y++) { stack.push(y * W); stack.push(y * W + W - 1); }
    let removed = 0;
    while (stack.length) {
      const idx = stack.pop();
      if (seen[idx]) continue;
      seen[idx] = 1;
      const q = idx * 4;
      const isBg = d[q + 3] < 8 || (dist2(q) < T2 && !edgeGuard[idx]);
      if (!isBg) continue;
      d[q + 3] = 0;
      removed++;
      const x = idx % W, y = (idx / W) | 0;
      if (x > 0) stack.push(idx - 1);
      if (x < W - 1) stack.push(idx + 1);
      if (y > 0) stack.push(idx - W);
      if (y < H - 1) stack.push(idx + W);
    }
    g.putImageData(id, 0, 0);
    return removed / (W * H);
  }

  let baseName = '';

  /** 从原图副本重新处理（换容差、开关去背景都走这里，不用重新选图） */
  function reprocessImage() {
    if (!baseCanvas) return;
    const c = document.createElement('canvas');
    c.width = baseCanvas.width;
    c.height = baseCanvas.height;
    c.getContext('2d').drawImage(baseCanvas, 0, 0);

    let stripped = 0;
    if ($('autoBg') && $('autoBg').checked) stripped = stripBackground(c, bgTol);
    loadFromCanvas(c);
    $('meta').textContent = `${baseName} · 原图 ${baseCanvas.width}×${baseCanvas.height}` +
      (stripped > 0.02 ? ` · 已抠背景 ${(stripped * 100).toFixed(0)}%` : ' · 未去背景');
    rerenderIfStill();
  }

  function useImageFile(file) {
    const im = new Image();
    im.onload = () => {
      // 关键：保留原始像素！之前先缩到 NX×NY，高清细节在第一步就没了
      const c = document.createElement('canvas');
      c.width = im.naturalWidth;
      c.height = im.naturalHeight;
      c.getContext('2d').drawImage(im, 0, 0);

      baseCanvas = c;
      baseName = file.name;
      reprocessImage();
    };
    im.src = URL.createObjectURL(file);
  }

  /* ================= UI ================= */
  /* ---- 侧栏折叠（桌面收起 / 手机抽屉） ---- */
  // 用 innerWidth 而不是 matchMedia：WebView 里如果视口被当成 980px，
  // matchMedia 和 CSS 可能不一致，导致按钮走了"桌面折叠"分支、侧栏被 display:none
  function isNarrow() { return window.innerWidth <= 820; }

  let panelOpen = false;

  /**
   * 统一的开合入口：用 JS 记住状态，而不是靠读 CSS 反推。
   *
   * 为什么之前会"关不掉"：兜底逻辑给 aside 写了内联 style（transform:none），
   * 内联样式优先级高于类，于是之后无论怎么切 class，它都永远显示。
   * 所以每次操作前先把内联样式清干净。
   */
  function applyPanel(open) {
    const aside = document.querySelector('aside');
    if (!aside) return;
    aside.style.cssText = '';                   // 清掉历史兜底样式
    document.body.classList.remove('panel-open', 'panel-collapsed');

    if (isNarrow()) {
      // 窄屏：默认藏（CSS 里 translateX(-100%)），加 panel-open 才滑出
      if (open) document.body.classList.add('panel-open');
    } else {
      // 宽屏：默认显示，加 panel-collapsed 才收起
      if (!open) document.body.classList.add('panel-collapsed');
    }

    panelOpen = open;

    // 兜底：切开之后如果实际可见性还是不对，才强制内联（只在内联一次）
    setTimeout(() => {
      const r = aside.getBoundingClientRect();
      const shown = r.width > 0 && r.right > 0 && getComputedStyle(aside).display !== 'none';
      if (!shown && open) {
        aside.style.cssText = 'display:block;position:fixed;left:0;top:0;bottom:0;' +
          'width:min(300px,86vw);z-index:65;transform:none;background:#0d1119;' +
          'border-right:1px solid #1e2534;padding:14px;overflow-y:auto';
      }
      fitCanvas();
    }, 260);
  }

  $('panelBtn').onclick = () => applyPanel(!panelOpen);

  $('scrim').onclick = () => applyPanel(false);

  // 启动：窄屏默认收起
  applyPanel(!isNarrow());

  // 只有宽度真的跨过断点时才重置，否则每次 resize（含启动时的一次）
  // 都会把用户刚打开的面板关掉
  let wasNarrow = isNarrow();
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const narrow = isNarrow();
      if (narrow !== wasNarrow) {
        wasNarrow = narrow;
        applyPanel(!narrow);
      }
      fitCanvas();
    }, 150);
  });

  // 调试/分享：?panel=open 直接打开
  if (QS.get('panel') === 'open') applyPanel(true);

  // 自检：?paneltest=1 连续开/关三次，把每次的实际可见性写到状态栏
  if (QS.get('paneltest')) {
    const log = [];
    const vis = () => {
      const a = document.querySelector('aside');
      const r = a.getBoundingClientRect();
      return (r.width > 0 && r.right > 0 && getComputedStyle(a).display !== 'none') ? '显示' : '隐藏';
    };
    const steps = [true, false, true, false, true, false];
    let i = 0;
    const tick = () => {
      if (i >= steps.length) {
        const el = document.getElementById('meta');
        if (el) el.textContent = '自检: ' + log.join(' → ');
        return;
      }
      const want = steps[i];
      applyPanel(want);
      setTimeout(() => {
        log.push((want ? '开' : '关') + '=' + vis());
        i++;
        tick();
      }, 420);
    };
    tick();
  }

  {
    const el = document.getElementById('aboutUpdated');
    if (el) {
      el.textContent = '最后更新：' +
        (BUILD_DATE.indexOf('__') === 0 ? '本地预览' : BUILD_DATE);
    }
  }

  $('btnPick').onclick = () => $('file').click();
  $('file').onchange = (e) => { if (e.target.files[0]) useImageFile(e.target.files[0]); e.target.value = ''; };
  const SHAPES = ['circle', 'airfoil', 'teardrop', 'car', 'rock', 'twin'];
  let shapeIdx = Math.max(0, SHAPES.indexOf(SHAPE));
  $('btnDemo').onclick = () => {
    shapeIdx = (shapeIdx + 1) % SHAPES.length;
    drawBuiltin(SHAPES[shapeIdx]);
    $('btnDemo').textContent = '内置形状：' + SHAPE_NAMES[SHAPES[shapeIdx]] + '（点击切换）';
  };
  $('btnReset').onclick = () => { initFlow(); flowInited = true; };
  $('btnRecenter').onclick = () => { objX = 0.30; objY = 0.50; objScale = 1.0; objAngle = 0; rebuildObject(); syncObjUI(); };
  $('btnShot').onclick = () => {
    const a = document.createElement('a');
    a.download = 'windtunnel-' + Date.now() + '.png';
    a.href = cv.toDataURL('image/png');
    a.click();
  };
  $('speed').oninput = (e) => { speed = +e.target.value; $('vSpeed').textContent = speed.toFixed(2); };
  $('visc').oninput  = (e) => { visc = +e.target.value;  $('vVisc').textContent = visc.toFixed(2); };
  $('vort').oninput  = (e) => { vortF = +e.target.value; $('vVort').textContent = vortF.toFixed(0); };
  $('life').oninput  = (e) => { life = +e.target.value;  $('vLife').textContent = life.toFixed(1); };
  $('inj').oninput   = (e) => { inject = +e.target.value; $('vInject').textContent = inject; };
  $('mode').onclick = (e) => {
    const b = e.target.closest('button[data-m]');
    if (!b) return;
    mode = b.dataset.m;
    [...$('mode').children].forEach(x => x.classList.toggle('on', x === b));
  };
  $('tool').onclick = (e) => {
    const b = e.target.closest('button[data-t]');
    if (!b) return;
    const t = b.dataset.t;
    if (t === 'clear') {
      paint.fill(0); mergePaint();
      $('meta').textContent = '已清空手画障碍物';
      return;
    }
    tool = t;
    [...$('tool').children].forEach(x => x.classList.toggle('on', x === b));
    $('meta').textContent = t === 'none' ? '拖动可移动物体' : (t === 'brush' ? '在画布上涂抹 = 加实体' : '在画布上涂抹 = 擦除实体');
  };
  $('brush').oninput = (e) => { brush = +e.target.value; $('vBrush').textContent = brush; };
  $('bgTol').oninput = (e) => {
    bgTol = +e.target.value; $('vBgTol').textContent = bgTol;
    if (baseCanvas) reprocessImage();          // 边拖边看效果
  };
  if ($('autoBg')) $('autoBg').onchange = () => { if (baseCanvas) reprocessImage(); };
  $('bright').oninput = (e) => { bright = +e.target.value; $('vBright').textContent = bright.toFixed(2); };
  $('hue').oninput = (e) => { smokeHue = +e.target.value; $('vHue').textContent = smokeHue; };

  $('px').oninput = (e) => { objX = +e.target.value / 100; rebuildObject(); syncObjUI(); };
  $('py').oninput = (e) => { objY = +e.target.value / 100; rebuildObject(); syncObjUI(); };
  $('ps').oninput = (e) => { objScale = +e.target.value / 100; rebuildObject(); syncObjUI(); };
  $('pa').oninput = (e) => { objAngle = +e.target.value; rebuildObject(); syncObjUI(); };
  $('res').onchange = (e) => {
    const [a, b] = e.target.value.split('x').map(Number);
    setResolution(a, b);
  };

  /** 换网格尺寸但不重载：重新分配数组 → 重建掩码 → 保持物体位置/参数 */
  function setResolution(nx, ny) {
    NX = nx; NY = ny;
    alloc();                       // 重新分配所有场 + 离屏画布
    flowInited = false;            // 新网格需要重新灌来流
    if (srcImg) rebuildObject();   // 从原图重建掩码（不是回到默认形状）
    else { window.__shape = window.__shape || 'circle'; drawBuiltin(window.__shape); }
    paint.fill(0);
    fitCanvas();
    $('vRes').textContent = NX + '×' + NY;
    $('meta').textContent = `已切到 ${NX}×${NY} · 物体和参数都保留了`;
  }

  /* ---- 直接在画布上摆放物体（像真实风洞那样） ---- */
  let dragging = false, dragStart = null;
  function toGrid(e) {
    const r = cv.getBoundingClientRect();
    return {
      x: ((e.clientX - r.left) / r.width) * NX,
      y: ((e.clientY - r.top) / r.height) * NY
    };
  }
  cv.addEventListener('pointerdown', (e) => {
    // 手机上必须阻止默认的滚动/缩放，否则 pointermove 会被浏览器接管
    if (e.cancelable) e.preventDefault();
    if (tool !== 'none') {
      dragging = true;
      const gp = toGrid(e);
      stamp(Math.round(gp.x), Math.round(gp.y));
      cv.setPointerCapture(e.pointerId);
      return;
    }
    if (!srcImg) return;
    dragging = true;
    dragStart = Object.assign(toGrid(e), { ox: objX, oy: objY });
    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', (e) => {
    if (e.cancelable && dragging) e.preventDefault();
    if (tool !== 'none' && dragging) {
      const gp = toGrid(e);
      stamp(Math.round(gp.x), Math.round(gp.y));
      return;
    }
    if (!dragging) return;
    const g = toGrid(e);
    objX = Math.max(0.02, Math.min(0.98, dragStart.ox + (g.x - dragStart.x) / NX));
    objY = Math.max(0.02, Math.min(0.98, dragStart.oy + (g.y - dragStart.y) / NY));
    rebuildObject();
    syncObjUI();
  });
  cv.addEventListener('pointercancel', () => { dragging = false; resetSmoke(); });
  cv.addEventListener('pointerup', () => {
    dragging = false;
    seedDye();       // 物体定下来了，重播条纹，清掉旧位置的洞
    resetSmoke();    // 顺手清掉拖动过程中的残影
  });
  cv.addEventListener('wheel', (e) => {
    if (!srcImg) return;
    e.preventDefault();
    if (e.shiftKey) {
      objAngle = (objAngle + (e.deltaY > 0 ? 5 : -5) + 360) % 360;
    } else {
      objScale = Math.max(0.15, Math.min(3, objScale * (e.deltaY > 0 ? 0.94 : 1.06)));
    }
    rebuildObject();
    syncObjUI();
  }, { passive: false });

  function syncObjUI() {
    if ($('px')) { $('px').value = objX * 100; $('vPx').textContent = (objX * 100).toFixed(0) + '%'; }
    if ($('py')) { $('py').value = objY * 100; $('vPy').textContent = (objY * 100).toFixed(0) + '%'; }
    if ($('ps')) { $('ps').value = objScale * 100; $('vPs').textContent = objScale.toFixed(2) + '×'; }
    if ($('pa')) { $('pa').value = objAngle; $('vPa').textContent = objAngle.toFixed(0) + '°'; }
  }

  ['dragenter', 'dragover'].forEach(ev => document.body.addEventListener(ev, (e) => {
    e.preventDefault(); $('drop').classList.add('hi');
  }));
  ['dragleave', 'drop'].forEach(ev => document.body.addEventListener(ev, (e) => {
    e.preventDefault(); $('drop').classList.remove('hi');
  }));
  document.body.addEventListener('drop', (e) => {
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) useImageFile(f);
  });

  /* ================= 启动 ================= */
  alloc();
  {
    window.__shape = SHAPE;          // 修 bug：启动时没把 URL 里的形状传进去，永远是圆柱
    const c = makeDemo();
    img = c;
    loadFromCanvas(c);
  }
  // UI 反映参数
  $('speed').value = speed; $('vSpeed').textContent = speed.toFixed(2);
  $('visc').value = visc;   $('vVisc').textContent = visc.toFixed(2);
  $('vort').value = vortF;  $('vVort').textContent = vortF.toFixed(0);
  $('life').value = life;   $('vLife').textContent = life.toFixed(1);
  $('inj').value = inject;  $('vInject').textContent = inject;
  $('bright').value = bright; $('vBright').textContent = bright.toFixed(2);
  $('hue').value = smokeHue; $('vHue').textContent = smokeHue;
  $('vRes').textContent = NX + '×' + NY;
  [...$('mode').children].forEach(b => b.classList.toggle('on', b.dataset.m === mode));
  $('btnDemo').textContent = '内置形状：' + (SHAPE_NAMES)[SHAPE] + '（点击切换）';
  syncObjUI();
  $('res').value = NX + 'x' + NY;   // 让下拉框反映真实分辨率
  $('meta').textContent = `网格 ${NX}×${NY} · ${mode} · 形状 ${SHAPE} · 风速 ${speed.toFixed(2)}`;

  if (QS.get('img')) useImageURL(QS.get('img'));

  if (STILL > 0) {
    for (let k = 0; k < STILL; k++) {
      advance();
      spawnParticles();
      stepParticles();
    }
    computeCurl();
    // 时间低通要迭代几次才收敛；静帧只调一次的话 us ≈ 0.15·u，线会几乎看不见
    for (let k = 0; k < 12; k++) smoothVel();
    computeForces();
    {
      const clEl = $('cl'), cdEl = $('cd');
      if (clEl) clEl.textContent = clNow.toFixed(2);
      if (cdEl) cdEl.textContent = cdNow.toFixed(2);
    }
    // 动画里烟是靠"多帧累积"变亮的；静帧只画一次会很暗，所以叠 8 次
    for (let k = 0; k < 6; k++) render(0.03);
    $('meta').textContent += ` · 静帧（跑了 ${STILL} 帧）`;
    if (QS.has('dbg')) {
      let dmax = 0, umax = 0, nz = 0;
      for (let i = 0, n = DX * DY; i < n; i++) {
        if (dye[i] > dmax) dmax = dye[i];
        if (dye[i] > 0.01) nz++;
      }
      for (let i = 0, n = NX * NY; i < n; i++) {
        const sp = Math.hypot(u[i], v[i]);
        if (sp > umax) umax = sp;
        { const su = Math.hypot(us[i], vs[i]); if (su > (window.__usmax || 0)) window.__usmax = su; }
      }
      const midY = Math.floor(DY / 2);
      const p1 = atD(5 * DS, midY), p2 = atD(40 * DS, midY), p3 = atD(DX - 5, midY);
      const p1u = at(5, Math.floor(NY / 2));
      $('meta').textContent = `grid=${NX}x${NY} dye=${DX}x${DY} dyeMax=${dmax.toFixed(2)} nz=${nz} uMax=${umax.toFixed(0)}` +
        ` | x5:u=${u[p1u].toFixed(1)},d=${dye[p1].toFixed(2)}` +
        ` | x40:d=${dye[p2].toFixed(2)} | xEnd:d=${dye[p3].toFixed(2)}`;
    }
  } else {
    let last = performance.now();
    // ── 自适应画质：连续掉帧就把染料倍率从 2× 降到 1× ──
    let frameAcc = 0, frameCnt = 0, autoDropped = false;
    function autoQuality(dtms) {
      if (autoDropped || DS <= 1) return;
      frameAcc += dtms; frameCnt++;
      if (frameCnt < 90) return;
      const avg = frameAcc / frameCnt;
      frameAcc = 0; frameCnt = 0;
      if (avg > 32) {                       // 平均低于 ~31fps 就降级
        DS = 1;
        autoDropped = true;
        alloc();
        flowInited = false;
        rebuildObject();
        flowInited = true;
        $('meta').textContent = `已自动降级：染料 ${avg.toFixed(0)}ms/帧偏慢 → 1× 分辨率`;
      }
    }
    function loop(now) {
      advance();
      spawnParticles();
      stepParticles();
      smoothVel();
      if ((frameNo++ % 10) === 0) {
        computeForces();
        const clEl = $('cl'), cdEl = $('cd');
        if (clEl) clEl.textContent = (Math.abs(clNow) < 0.001 ? '0' : clNow.toFixed(2)) + '  (Cl)';
        if (cdEl) cdEl.textContent = (Math.abs(cdNow) < 0.001 ? '0' : cdNow.toFixed(2)) + '  (Cd)';
      }
      render(mode === 'streak' ? 0.035 : 0.1);
      requestAnimationFrame(loop);
    }
    render(0.1);
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
