<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>风洞实验室 · GPU 求解（WebGL2）</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070d; overflow: hidden;
               overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
  /* touch-action: none —— 手机版的关键。不写这一句，手指一拖浏览器就当成滚动/缩放，
     pointermove 直接断流（还会发 pointercancel），画面上什么都不动 */
  #cv { display: block; width: 100%; height: 100%;
        touch-action: none; -ms-touch-action: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #side { -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  /* 抽屉遮罩：手机上点一下画布外的地方就收起侧栏 */
  #scrim { position: fixed; inset: 0; z-index: 9; background: rgba(0,0,0,.5);
           display: none; }
  @media (max-width: 820px) {
    body:not(.collapsed) #scrim { display: block; }
  }
  body:not(.collapsed) #cv { margin-left: 220px; width: calc(100% - 220px); }
  #side {
    position: fixed; left: 0; top: 0; bottom: 0; width: 220px; z-index: 10;
    background: rgba(13,17,25,.94); border-right: 1px solid #1e2534;
    padding: 12px; overflow-y: auto; color: #c9d3e8;
    font: 12px/1.7 system-ui, "Microsoft YaHei", sans-serif;
    transition: transform .2s;
  }
  #side h1 { font-size: 13px; margin: 26px 0 2px; }
  #side .sub { font-size: 10.5px; color: #67748c; margin-bottom: 10px; }
  #side .group { border-top: 1px solid #1a2130; margin-top: 10px; padding-top: 8px; }
  #side label { display: block; font-size: 11px; color: #8b9ab8; margin: 10px 0 3px; }
  #side .val { float: right; color: #5eead4; font-family: ui-monospace, monospace; }
  #side button, #side select {
    width: 100%; padding: 7px 9px; margin-top: 6px; border-radius: 8px;
    border: 1px solid #232b3e; background: #141a26; color: #cfd8ea;
    font: inherit; cursor: pointer;
  }
  #side button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
  #side button:hover { background: #1b2333; }
  #side button.primary:hover { background: #1d4ed8; }
  #side .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
  #side .seg.c3 { grid-template-columns: 1fr 1fr 1fr; }
  #side .seg button { margin: 0; padding: 6px 4px; font-size: 11px; }
  #side .seg button.on { background: #0e7490; border-color: #0e7490; color: #e6feff; }
  #side input[type=range] { width: 100%; accent-color: #2dd4bf; }
  .chk { display: flex; align-items: center; gap: 7px; font-size: 11.5px !important;
         color: #8b9ab8; margin-top: 8px !important; cursor: pointer; }
  .chk input { accent-color: #2dd4bf; }
  .hint { font-size: 10.5px; color: #566178; margin-top: 14px; line-height: 1.6; }
  .about-meta { font-size: 11px; color: #67748c; line-height: 1.8; }
  .about-link { display: flex; align-items: center; gap: 7px; margin-top: 6px; padding: 6px 8px;
                border-radius: 8px; border: 1px solid #232b3e; color: #9fb0cc;
                text-decoration: none; font-size: 11px; }
  .about-link:hover { background: #1b2333; }
  .about-link svg { width: 14px; height: 14px; flex: none; }
  #forces b { font-family: ui-monospace, monospace; }
  #btnPanel {
    position: fixed; left: 232px; top: 10px; z-index: 20; width: 34px; height: 34px;
    border-radius: 9px; border: 1px solid #232b3e; background: rgba(16,20,31,.85);
    color: #dbe2f3; cursor: pointer; font-size: 14px; transition: left .2s;
  }
  body.collapsed #side { transform: translateX(-100%); }
  body.collapsed #hud { left: 12px; }
  body.collapsed #btnPanel { left: 10px; }
  #hud {
    position: fixed; left: 278px; top: 12px; color: #9fb0cc;
    font: 12px/1.6 ui-monospace, Consolas, monospace; pointer-events: none;
    text-shadow: 0 1px 2px #000;
  }
  /* 流线/粒子画在这张覆盖层上（和 WebGL 画布严格对齐） */
  #overlay { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 5; }
  #err { position: fixed; inset: 0; padding: 20px; color: #ffb4b4;
         background: #180a0d; font: 12px/1.5 monospace; white-space: pre-wrap; display: none; }
  /* 窄屏（手机/竖屏）：侧栏变抽屉浮在画布上，不再挤占画布宽度 */
  @media (max-width: 820px) {
    body:not(.collapsed) #cv { margin-left: 0; width: 100%; }
    #side { box-shadow: 8px 0 24px rgba(0,0,0,.55); }
    #hud { left: 12px; top: 54px; font-size: 10.5px; }
    #btnPanel { left: 10px; }
    body.collapsed #hud { left: 12px; }
  }
</style>
</head>
<body>

<button id="btnPanel">☰</button>
<aside id="side">

  <div class="sub">WebGL2 · 着色器求解</div>

  <input type="file" id="file" accept="image/*" hidden>

  <select id="presets">

    <input type="range" id="py" min="2" max="98" step="1" value="50">
    <label>物体大小 <span class="val" id="vPs">0.70×</span></label>

    <input type="range" id="pa" min="0" max="359" step="1" value="0">

    <label class="chk"><input type="checkbox" id="autostrip"> 自动去背（白底照片）</label>
    <label class="chk"><input type="checkbox" id="wall"> 墙线模式（细线当墙）</label>

    <input type="range" id="curl" min="0" max="60" step="1" value="28">

  <div class="group">

    <div class="seg" id="segField">

    <div class="seg" id="segPart">

  <div class="group">

<div id="hud">WebGL2 GPU 求解器 · 加载中…</div>
<pre id="dbg" style="display:none"></pre>
<div id="err"></div>
<script>
"use strict";
(function () {
  const cv = document.getElementById('cv');
  const hud = document.getElementById('hud');
  const errBox = document.getElementById('err');
  const fail = (msg) => { errBox.style.display = 'block'; errBox.textContent = msg; throw new Error(msg); };

  const QS = new URLSearchParams(location.search);
  const SIM = parseInt(QS.get('sim') || '0', 10) ||      // 模拟分辨率（正方形网格）
    (window.innerWidth <= 820 ? 256 : 512);   // 窄屏=手机，默认降一档
  let PRESSURE_ITERS = parseInt(QS.get('iters') || '0', 10) ||
    (window.innerWidth <= 820 ? 16 : 24);   // 窄屏=手机，少迭代几次
  let VEL_DISS = parseFloat(QS.get('vdis') || '1');   // 默认不额外耗散（0.994 时 60 帧掉 30%，靠两端硬吹掩盖过）
  const DYE_DISS = parseFloat(QS.get('ddis') || '0.9995');
  let SPEED = parseFloat(QS.get('speed') || '1.0');
  let CURL_AMT = parseFloat(QS.get('curl') || '28');
  let INFLOW = parseFloat(QS.get('inflow') || '0.35');
  const VIEW_VEL = QS.get('view') === 'vel';

  // ?keepbuffer=1：保留绘制缓冲。无头浏览器截图默认只能拍到最后一次绘制（rAF 里的不算），
  // 开了它才能截到"主循环跑了几秒之后"的画面
  const gl = cv.getContext('webgl2', {
    alpha: false, antialias: false, depth: false,
    powerPreference: 'high-performance',     // 别用省电档跑
    preserveDrawingBuffer: QS.get('keepbuffer') === '1'
  });
  if (!gl) fail('这个环境不支持 WebGL2');
  const extF = gl.getExtension('EXT_color_buffer_float');
  const extL = gl.getExtension('OES_texture_float_linear');
  if (!extF) fail('缺少 EXT_color_buffer_float，无法做 GPGPU');

  // 竖屏：显式 ?orient=portrait / landscape；不指定就按窗口比例自动判断
  const ORIENT_Q = QS.get('orient');
  let PORTRAIT = ORIENT_Q === 'portrait' ||
    (ORIENT_Q !== 'landscape' && window.innerWidth < window.innerHeight);

  /* ---------------- 着色器 ---------------- */
  const VS = `#version 300 es
  layout(location=0) in vec2 aPos;
  out vec2 vUv;
  void main(){ vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;

  const HEAD = `#version 300 es
  precision highp float;
  precision highp sampler2D;
  in vec2 vUv;
  out vec4 fragColor;
  uniform vec2 texel;

  vec2 bilerpU(sampler2D t, vec2 uv){
    return texture(t, uv).xy;
  }`;

  // 半拉格朗日对流（速度）
  const FS_ADVECT_VEL = HEAD + `
  uniform sampler2D uVel;
  uniform float dt;
  uniform float dissipation;
  void main(){
    vec2 uv = vUv - dt * texture(uVel, vUv).xy;
    fragColor = vec4(texture(uVel, uv).xy * dissipation, 0.0, 1.0);
  }`;

  // 散度
  const FS_DIVERGENCE = HEAD + `
  uniform sampler2D uVel;
  uniform sampler2D uSolid;
  void main(){
    float s = texture(uSolid, vUv).r;
    if (s > 0.5) { fragColor = vec4(0.0,0.0,0.0,1.0); return; }
    float L = texture(uVel, vUv - vec2(texel.x,0.0)).x;
    float R = texture(uVel, vUv + vec2(texel.x,0.0)).x;
    float B = texture(uVel, vUv - vec2(0.0,texel.y)).y;
    float T = texture(uVel, vUv + vec2(0.0,texel.y)).y;
    // 壁面：固体邻居用中心速度（无穿透）
    if (texture(uSolid, vUv - vec2(texel.x,0.0)).r > 0.5) L = texture(uVel, vUv).x;
    if (texture(uSolid, vUv + vec2(texel.x,0.0)).r > 0.5) R = texture(uVel, vUv).x;
    if (texture(uSolid, vUv - vec2(0.0,texel.y)).r > 0.5) B = texture(uVel, vUv).y;
    if (texture(uSolid, vUv + vec2(0.0,texel.y)).r > 0.5) T = texture(uVel, vUv).y;
    fragColor = vec4(0.5 * ((R - L) + (T - B)), 0.0, 0.0, 1.0);
  }`;

  // Jacobi 压力迭代
  const FS_PRESSURE = HEAD + `
  uniform sampler2D uPressure;
  uniform sampler2D uDiv;
  uniform sampler2D uSolid;
  uniform int uOutlet;
  void main(){
    if (texture(uSolid, vUv).r > 0.5) { fragColor = vec4(0.0,0.0,0.0,1.0); return; }
    // 出口给 Dirichlet p=0：有了这个"压力出口"，速度那边才敢用零梯度外推
    if (uOutlet == 2 && vUv.x > 0.97) { fragColor = vec4(0.0,0.0,0.0,1.0); return; }
    float L = texture(uPressure, vUv - vec2(texel.x,0.0)).x;
    float R = texture(uPressure, vUv + vec2(texel.x,0.0)).x;
    float B = texture(uPressure, vUv - vec2(0.0,texel.y)).x;
    float T = texture(uPressure, vUv + vec2(0.0,texel.y)).x;
    float d = texture(uDiv, vUv).x;
    fragColor = vec4((L + R + B + T - d) * 0.25, 0.0, 0.0, 1.0);
  }`;

  // 减压力梯度（投影）
  const FS_GRADIENT = HEAD + `
  uniform sampler2D uPressure;
  uniform sampler2D uVel;
  uniform sampler2D uSolid;
  uniform float uInflow;
  uniform int uOutlet;
  void main(){
    if (texture(uSolid, vUv).r > 0.5) { fragColor = vec4(0.0,0.0,0.0,1.0); return; }
    float L = texture(uPressure, vUv - vec2(texel.x,0.0)).x;
    float R = texture(uPressure, vUv + vec2(texel.x,0.0)).x;
    float B = texture(uPressure, vUv - vec2(0.0,texel.y)).x;
    float T = texture(uPressure, vUv + vec2(0.0,texel.y)).x;
    vec2 v = texture(uVel, vUv).xy - 0.5 * vec2(R - L, T - B);
    // 入口：Dirichlet 吹入
    if (vUv.x < 0.03) v = vec2(uInflow, 0.0);
    // 出口：0=硬吹（旧行为，稳定但物理错）1=零梯度 2=零梯度+压力出口（NRBC 式）
    else if (vUv.x > 0.97) {
      if (uOutlet == 0) v = vec2(uInflow, 0.0);
      else v = texture(uVel, vUv - vec2(texel.x, 0.0)).xy;
    }
    fragColor = vec4(v, 0.0, 1.0);
  }`;

  // 涡量约束
  const FS_VORTICITY = HEAD + `
  uniform sampler2D uVel;
  uniform sampler2D uSolid;
  uniform float curlAmount;
  uniform float dt;
  void main(){
    if (texture(uSolid, vUv).r > 0.5) { fragColor = vec4(0.0,0.0,0.0,1.0); return; }
    float L = texture(uVel, vUv - vec2(texel.x,0.0)).y;
    float R = texture(uVel, vUv + vec2(texel.x,0.0)).y;
    float B = texture(uVel, vUv - vec2(0.0,texel.y)).x;
    float T = texture(uVel, vUv + vec2(0.0,texel.y)).x;
    float w = 0.5 * ((R - L) - (T - B));
    float aL = abs(texture(uVel, vUv - vec2(texel.x,0.0)).y);
    float aR = abs(texture(uVel, vUv + vec2(texel.x,0.0)).y);
    float aB = abs(texture(uVel, vUv - vec2(0.0,texel.y)).x);
    float aT = abs(texture(uVel, vUv + vec2(0.0,texel.y)).x);
    vec2 grad = vec2(abs(aT) - abs(aB), abs(aR) - abs(aL));
    grad /= (length(grad) + 1e-4);
    vec2 force = curlAmount * w * vec2(grad.y, -grad.x);
    vec2 v = texture(uVel, vUv).xy + force * dt;

  uniform float inflow;
  void main(){ fragColor = vec4(inflow, 0.0, 0.0, 1.0); }`;

  const FS_INLET_VEL = HEAD + `
  uniform sampler2D uVel;
  uniform float inflow;
  uniform float wobble;
  void main(){
    vec2 v = texture(uVel, vUv).xy;
    if (vUv.x < 0.03) v = vec2(inflow, wobble);
    // 上下边界轻微夹紧，避免贴边堆积
    if (vUv.y < 0.01 || vUv.y > 0.99) v.y = 0.0;
    fragColor = vec4(v, 0.0, 1.0);

  // 染料对流
  const FS_ADVECT_DYE = HEAD + `
  uniform sampler2D uVel;
  uniform sampler2D uDye;
  uniform sampler2D uSolid;
  uniform float dt;
  uniform float dissipation;
  void main(){
    if (texture(uSolid, vUv).r > 0.5) { fragColor = vec4(0.0,0.0,0.0,1.0); return; }

  const FS_SEED_DYE = HEAD + `
  void main(){
    float band = step(0.5, fract(vUv.y * 14.0));
    fragColor = vec4(vec3(band), 1.0);
  }`;

  uniform sampler2D uSrc;
  void main(){ fragColor = vec4(texture(uSrc, vUv).xy, 0.0, 1.0); }`;

  uniform sampler2D uDye;
  uniform float time;
  uniform float uWide;
  void main(){
    vec3 c = texture(uDye, vUv).xyz;

  uniform sampler2D uDye;
  uniform sampler2D uVel;
  uniform sampler2D uSolid;
  uniform sampler2D uPressure;
  uniform sampler2D uMask;
  uniform int fieldMode;      // 0 关 / 1 压强 / 2 速度 / 3 涡量
  uniform int smokeOn;
  uniform int outlineOn;
  uniform int dimSolid;       // 粒子层里把物体压暗
  uniform int uPortrait;
  uniform sampler2D uLut;     // 色标查找表（256×1）
  uniform float uMaxSpeed;
  uniform float uPScale;
  uniform float uMaxCurl;
  uniform float uBright;
  uniform vec3 uSmokeColor;

  // 色标：从 256×1 的 LUT 纹理查（Jet / Turbo / Viridis / Plasma / Inferno 在 JS 里生成）
  vec3 cmap(float t){ return texture(uLut, vec2(clamp(t, 0.0, 1.0), 0.5)).rgb; }
  // 有正负的场（压强/涡量）：0 落在色标中间
  vec3 dcmap(float t){ return cmap(0.5 + 0.5 * clamp(t, -1.0, 1.0)); }
  float curlAt(vec2 uv){
    float L = texture(uVel, uv - vec2(texel.x, 0.0)).y;
    float R = texture(uVel, uv + vec2(texel.x, 0.0)).y;
    float B = texture(uVel, uv - vec2(0.0, texel.y)).x;
    float T = texture(uVel, uv + vec2(0.0, texel.y)).x;
    return 0.5 * ((R - L) - (T - B));
  }

  void main(){
    // 竖屏：物理不动，只把采样坐标转 90°（风从下往上），和 CPU 版的约定一致
    vec2 fuv = uPortrait == 1 ? vec2(vUv.y, 1.0 - vUv.x) : vUv;

    if (texture(uSolid, fuv).r > 0.5) {
      vec4 m = texture(uMask, fuv);
      vec3 col = mix(vec3(0.05,0.06,0.09), m.rgb * (dimSolid == 1 ? 0.45 : 1.0),
                     clamp(m.a, 0.0, 1.0));
      // 白边：用**高分辨率**颜色贴图的 alpha 判断（按网格掩码描边会有格子锯齿）
      if (outlineOn == 1) {
        float rim = 1.0 - smoothstep(0.78, 0.99, m.a);
        col = mix(col, vec3(0.86, 0.92, 1.0), rim * 0.9);

      fragColor = vec4(col, 1.0);
      return;
    }

    // 底层：场
    vec3 c = vec3(0.03, 0.045, 0.08);
    if (fieldMode == 1) {
      c = dcmap(texture(uPressure, fuv).x * uPScale);
    } else if (fieldMode == 2) {
      c = cmap(length(texture(uVel, fuv).xy) / max(uMaxSpeed, 1e-4));
    } else if (fieldMode == 3) {
      c = dcmap(curlAt(fuv) * uMaxCurl);
    }

    // 中层：条纹烟
    if (smokeOn == 1) {
      float d = clamp(texture(uDye, fuv).x, 0.0, 1.0);
      vec3 smoke = uSmokeColor * (0.18 + 0.92 * d);
      c = mix(c, smoke, clamp(d * 0.97 + 0.03, 0.0, 1.0) * 0.95);
    }

    fragColor = vec4(c * uBright, 1.0);
  }`;

  /* ---------------- 速度矢量箭头 ---------------- */
  const VS_ARROWS = `#version 300 es
  precision highp float;
  uniform sampler2D uVel;
  uniform sampler2D uSolid;
  uniform int uNA;            // 每边的箭头数
  uniform int uPortrait;
  uniform float uLen;         // 满速箭头长度（UV）
  uniform float uMaxSpeed;
  out float vA;
  void main(){
    int arrow = gl_VertexID / 6;
    int corner = gl_VertexID % 6;      // 3 段线：(尾,尖) (尖,左翼) (尖,右翼)
    int ax = arrow % uNA, ay = arrow / uNA;
    vec2 p = (vec2(float(ax), float(ay)) + 0.5) / float(uNA);
    vec2 v = texture(uVel, p).xy;
    float sp = length(v);
    vec2 dir = sp > 1e-5 ? v / sp : vec2(1.0, 0.0);
    vec2 perp = vec2(-dir.y, dir.x);
    float len = uLen * clamp(sp / max(uMaxSpeed, 1e-4) * 1.5, 0.12, 1.0);
    vec2 tip = p + dir * len;
    vec2 h1 = tip - dir * len * 0.36 + perp * len * 0.24;
    vec2 h2 = tip - dir * len * 0.36 - perp * len * 0.24;
    vec2 q = (corner == 0) ? p
           : (corner == 1 || corner == 2 || corner == 4) ? tip
           : (corner == 3) ? h1 : h2;
    vA = clamp(sp / max(uMaxSpeed, 1e-4), 0.15, 1.0);
    // 物体内部不画箭头
    if (texture(uSolid, p).r > 0.5) { vA = 0.0; len = 0.0; q = p; }

    vec2 uv = uPortrait == 1 ? vec2(1.0 - q.y, q.x) : q;
    gl_Position = vec4(uv * 2.0 - 1.0, 0.0, 1.0);
  }`;

  const FS_ARROWS = `#version 300 es
  precision highp float;
  in float vA;
  uniform vec3 uArrowColor;
  uniform float uArrowAlpha;
  out vec4 fragColor;
  void main(){ fragColor = vec4(uArrowColor, uArrowAlpha * vA); }`;

  const FS_PARTICLE_INIT = HEAD + `
  uniform float uSeed;
  float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7)) + uSeed) * 43758.5453); }
  void main(){
    // x,y = 位置，z = 年龄，w = 个体随机
    fragColor = vec4(mix(0.02, 0.98, hash(vUv)),
                     mix(0.02, 0.98, hash(vUv + 19.7)),
                     hash(vUv + 3.3) * 4.0,
                     hash(vUv + 7.1));
  }`;

  const FS_PARTICLE = HEAD + `
  uniform sampler2D uState;
  uniform sampler2D uVel;
  uniform sampler2D uSolid;
  uniform float dt;
  uniform float uLife;
  uniform float uSeed;
  float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7)) + uSeed) * 43758.5453); }
  void main(){
    vec4 s = texture(uState, vUv);
    vec2 pos = s.xy;
    float age = s.z + dt;
    vec2 v = texture(uVel, clamp(pos, 0.001, 0.999)).xy;
    pos += v * dt;
    // 每个粒子寿命不同（s.w 是个体随机数），否则会同一批出生、同一批死 → 出现"浪"一样的团块

    // 出界 / 进固体 / 太老 → 在全场随机位置重新投种（不是只在入口，避免左边越积越密）
    float blocked = texture(uSolid, clamp(pos, 0.0, 1.0)).r;

  const VS_STREAKS = `#version 300 es
  precision highp float;
  uniform sampler2D uState;
  uniform sampler2D uVel;
  uniform int uPW;
  uniform int uPortrait;
  uniform float uLife;
  uniform float uStreak;
  out float vAlpha;
  void main(){
    int idx = gl_VertexID / 2;          // 一个粒子两个顶点
    int head = gl_VertexID % 2;         // 0=头 1=尾
    ivec2 c = ivec2(idx % uPW, idx / uPW);
    vec4 s = texelFetch(uState, c, 0);
    vec2 v = texture(uVel, clamp(s.xy, 0.001, 0.999)).xy;
    vec2 p = s.xy - v * uStreak * float(head);
    float life = 1.0 - clamp(s.z / uLife, 0.0, 1.0);
    vAlpha = life * (1.0 - 0.85 * float(head));
    // 必须和显示 pass 用同一套竖屏旋转，否则竖屏里脉线会比烟/流线拧 90°
    vec2 uv = uPortrait == 1 ? vec2(1.0 - p.y, p.x) : p;
    gl_Position = vec4(uv * 2.0 - 1.0, 0.0, 1.0);
  }`;

  const FS_STREAKS = `#version 300 es
  precision highp float;
  in float vAlpha;
  out vec4 fragColor;
  void main(){
    fragColor = vec4(vec3(0.60, 0.85, 1.0) * vAlpha, vAlpha);
  }`;

  /* ---------------- GL 工具 ---------------- */
  function compile(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS))
      fail('着色器编译失败：\n' + gl.getShaderInfoLog(sh) + '\n\n' + src.split('\n').slice(0, 30).join('\n'));

  function program(fs, vsSrc) {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vsSrc || VS));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) fail('链接失败：\n' + gl.getProgramInfoLog(p));
    const u = {};
    const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) {

      u[info.name] = gl.getUniformLocation(p, info.name);
    }

  }

  const quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  function makeTarget(w, h, internal, format, type) {
    const tex = gl.createTexture();

    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

    gl.bindFramebuffer(gl.FRAMEBUFFER, t.fbo);
    gl.viewport(0, 0, t.w, t.h);

    gl.clear(gl.COLOR_BUFFER_BIT);

    const w = cv.clientWidth || 1, h = cv.clientHeight || 1;
    const ratio = PORTRAIT ? (w / h) : (h / w);
    return Math.max(48, Math.min(2048, Math.round(sx * ratio)));
  }
  let vel, pressure, divergence, dye, solid, maskColor, velSmall;
  let MK = 1;                        // 颜色贴图的超采样倍数（1..4）

  function allocTargets() {
    const old = [divergence, solid, maskColor, velSmall];

    old.forEach(t => { if (t) { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fbo); } });

           makeTarget(S, SY, gl.RG16F, gl.RG, gl.HALF_FLOAT)];
    pressure = [makeTarget(S, SY, gl.R16F, gl.RED, gl.HALF_FLOAT),

    divergence = makeTarget(S, SY, gl.R16F, gl.RED, gl.HALF_FLOAT);
    dye = [makeTarget(S, SY, gl.RGBA16F, gl.RGBA, gl.HALF_FLOAT),

    MK = Math.max(1, Math.min(4, Math.ceil(

    pA = pressure[0]; pB = pressure[1];
    dA = dye[0]; dB = dye[1];

    // 保留手画层（尺寸没变就沿用，别让一次窗口 resize 把用户画的墙擦掉）
    if (!paint || paint.length !== S * SY) paint = new Uint8Array(S * SY);

    fillVel(vel[1], INFLOW, false);

  const PW = Math.max(16, Math.min(256, parseInt(QS.get('pn') || '96', 10)));

    pressure: program(FS_PRESSURE),
    gradient: program(FS_GRADIENT),
    vorticity: program(FS_VORTICITY),
    inletVel: program(FS_INLET_VEL),
    fillVel: program(FS_FILL_VEL),
    seedDye: program(FS_SEED_DYE),
    copySrc: program(FS_COPY),
    advectDye: program(FS_ADVECT_DYE),
    inlet: program(FS_INLET),
    display: program(FS_DISPLAY),
    particleInit: program(FS_PARTICLE_INIT),
    particle: program(FS_PARTICLE),

  }

  function seedDye() {

  }

  function resetFlow() {

    fillVel(vel[1], INFLOW);

  function blit(target, prog, setup) {

    gl.useProgram(prog.p);

      1 / (target ? target.w : cv.width), 1 / (target ? target.h : cv.height));

  }

  /* ---------------- 障碍物掩码 ---------------- */
  let hasMask = false;
  let maskImg = null;                 // 当前障碍物图（预设/上传/内置形状）
  let objAngle = 0;                   // 物体转角（度）
  let objX = 0.3, objY = 0.5, objScale = 0.7;
  let tool = 'none';                  // none | brush | eraser
  let brush = 4;                      // 笔刷半径（格）
  let paint = null;                   // 手画层：每格 0/1

  /** 内置形状：画一张和网格同尺寸的图（和 CPU 版 makeDemo 同一套画法） */
  const SHAPE_NAMES = ['圆柱', '翼型', '水滴', '汽车', '岩石', '双柱'];
  let shapeIdx = 0;
  function makeShapeCanvas(name) {
    const c = document.createElement('canvas');
    c.width = S; c.height = SY;
    const g = c.getContext('2d');
    g.fillStyle = '#e2e8f0';
    const cx = S * 0.5, cy = SY * 0.5, R = Math.min(S, SY) * 0.12;
    if (name === '汽车') {
      const L = R * 3.4, H = R * 1.0;
      g.beginPath();
      g.moveTo(cx - L * 0.5, cy + H * 0.35);
      g.lineTo(cx - L * 0.45, cy - H * 0.15);
      g.lineTo(cx - L * 0.20, cy - H * 0.20);
      g.lineTo(cx - L * 0.05, cy - H * 0.95);
      g.lineTo(cx + L * 0.22, cy - H * 0.95);
      g.lineTo(cx + L * 0.34, cy - H * 0.20);
      g.lineTo(cx + L * 0.48, cy + H * 0.10);
      g.lineTo(cx + L * 0.46, cy + H * 0.35);
      g.closePath(); g.fill();
      g.beginPath(); g.arc(cx - L * 0.28, cy + H * 0.42, R * 0.30, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.arc(cx + L * 0.28, cy + H * 0.42, R * 0.30, 0, Math.PI * 2); g.fill();
    } else if (name === '岩石') {
      let seed = 12345;
      const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
      g.beginPath();
      const N = 26;
      for (let k = 0; k < N; k++) {
        const a = k / N * Math.PI * 2;
        const rr = R * (0.85 + 0.55 * rnd()) * (1 + 0.15 * Math.cos(a * 3));
        const px = cx + Math.cos(a) * rr * 1.35;
        const py = cy + Math.sin(a) * rr * 0.95;
        if (k === 0) g.moveTo(px, py); else g.lineTo(px, py);
      }
      g.closePath(); g.fill();
    } else if (name === '双柱') {
      g.beginPath(); g.arc(cx - R * 1.3, cy, R * 0.75, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.arc(cx + R * 1.3, cy, R * 0.75, 0, Math.PI * 2); g.fill();
    } else if (name === '翼型') {
      g.beginPath(); g.ellipse(cx, cy, R * 3.0, R * 0.42, -0.10, 0, Math.PI * 2); g.fill();
    } else if (name === '水滴') {
      g.beginPath();
      g.arc(cx - R, cy, R, Math.PI * 0.5, Math.PI * 1.5);
      g.lineTo(cx + R * 2, cy);
      g.closePath(); g.fill();
    } else {
      g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.fill();
    }
    return c;
  }

  /**
   * 把 maskImg 按当前位置/缩放/转角/墙线/反转 重新光栅化并上传（手画层一起并进去）。
   *
   * ⚠️ 两套 y 方向必须在这里对齐（之前就是这里错，导入的图是倒立的）：
   *     画布 2D：y 向下（第 0 行在顶）
   *     场/纹理：y 向上（t=0 在底，显示 pass 用 vUv.y=0 当屏幕底部）
   *   所以：① 物体中心要画在画布 y = S·(1−objY)；② 上传前把行整体翻转一次。
   */
  function uploadMask() {
    const wall = document.getElementById('wall')?.checked;
    const invert = document.getElementById('invert')?.checked;
    const c = document.createElement('canvas');
    c.width = S; c.height = SY;
    const g = c.getContext('2d');
    if (maskImg) {
      // 等比缩放到网格：长边占 objScale×短边（场可能是宽的，按短边算才不会顶出边界）
      const fit = Math.min(S, SY) * objScale / Math.max(maskImg.width, maskImg.height);
      const w = maskImg.width * fit, h = maskImg.height * fit;
      // 物体待在物理坐标里，长轴永远顺着风（竖屏只是画面整体转 90°）
      g.save();
      g.translate(objX * S, SY * (1 - objY));   // objY 是场坐标（向上），画布是向下的
      g.rotate(objAngle * Math.PI / 180);
      g.drawImage(maskImg, -w / 2, -h / 2, w, h);
      g.restore();
    }
    const data = g.getImageData(0, 0, S, SY).data;
    const out = new Uint8Array(S * SY);
    const thr = wall ? 8 : 100;
    for (let y = 0; y < SY; y++) {
      const fy = SY - 1 - y;                    // 画布行 y（向下）↔ 场行 fy（向上）
      for (let x = 0; x < S; x++) {
        const i = y * S + x;
        let a = data[i * 4 + 3] > thr ? 1 : 0;
        if (invert) a = 1 - a;
        if (paint && paint[fy * S + x]) a = 1; // 手画层也是场坐标
        out[fy * S + x] = a ? 255 : 0;
      }
    }
    if (wall) {
      // 膨胀 1 格：细线在低分辨率下会整条消失
      const dil = new Uint8Array(out);
      for (let y = 1; y < SY - 1; y++) {
        for (let x = 1; x < S - 1; x++) {
          const i = y * S + x;
          if (out[i]) {
            dil[i - 1] = 255; dil[i + 1] = 255; dil[i - S] = 255; dil[i + S] = 255;
          }
        }
      }
      out.set(dil);
    }
    gl.bindTexture(gl.TEXTURE_2D, solid.tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, S, SY, 0, gl.RED, gl.UNSIGNED_BYTE, out);
    solidBits = out;                  // 留一份在 JS 里：流线积分要判断"撞墙没有"
    // 同一张画布也当颜色贴图传上去（显示固体格用）。
    // 画布上传默认也是"顶行→t=0"，所以要开 UNPACK_FLIP_Y 和上面的行翻转保持一致。
    // 颜色贴图：同一套变换按 MK 倍再画一遍（原图直接画，不在中间缩一次 → 不糊）
    const cc = document.createElement('canvas');
    cc.width = S * MK; cc.height = SY * MK;
    const cg = cc.getContext('2d');
    if (maskImg) {
      const fit = Math.min(S, SY) * objScale / Math.max(maskImg.width, maskImg.height);
      const w = maskImg.width * fit, h = maskImg.height * fit;
      cg.save();
      cg.scale(MK, MK);
      cg.translate(objX * S, SY * (1 - objY));
      cg.rotate(objAngle * Math.PI / 180);
      cg.imageSmoothingQuality = 'high';
      cg.drawImage(maskImg, -w / 2, -h / 2, w, h);
      cg.restore();
    }
    // 手画的地方给个墙色（一次性拼一张小图再放大，别逐格 fillRect）
    if (paint) {
      let any = false;
      for (let i = 0; i < paint.length && !any; i++) if (paint[i]) any = true;
      if (any) {
        const pc = document.createElement('canvas');
        pc.width = S; pc.height = SY;
        const pg = pc.getContext('2d');
        const id = pg.createImageData(S, SY);
        for (let y = 0; y < SY; y++) {
          const fy = SY - 1 - y;              // 场行 → 画布行
          for (let x = 0; x < S; x++) {
            if (!paint[fy * S + x]) continue;
            const o = (y * S + x) * 4;
            id.data[o] = 226; id.data[o + 1] = 232; id.data[o + 2] = 240; id.data[o + 3] = 255;
          }
        }
        pg.putImageData(id, 0, 0);
        cg.save();
        cg.scale(MK, MK);
        cg.imageSmoothingEnabled = false;     // 手画是格子的，别糊
        cg.drawImage(pc, 0, 0);
        cg.restore();
      }
    }
    gl.bindTexture(gl.TEXTURE_2D, maskColor.tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, cc);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    hasMask = true;

    // 包围盒（气动力要用：量测线放在物体后缘下游，参考高度=迎风高度）
    let minX = S, maxX = -1, minY = SY, maxY = -1;
    for (let y = 1; y < SY - 1; y++) {
      for (let x = 1; x < S - 1; x++) {
        if (!out[y * S + x]) continue;
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
    maskBox = maxX > minX ? { minX, maxX, minY, maxY } : null;
  }

  function tryLoadImage(url) {
    return new Promise((resolve) => {
      const im = new Image();
      im.onload = () => resolve(im);
      im.onerror = () => resolve(null);
      im.src = url;
    });
  }

  /** 自动去背：从四边泛洪把"背景色"抹成透明（白底照片直接能当障碍物） */
  function stripBackground(canvas, tol) {
    const g = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const id = g.getImageData(0, 0, W, H);
    const d = id.data;
    tol = tol || 26;
    // 背景色 = 四角+四边中点的中位数
    const pick = [];
    for (const [x, y] of [[0,0],[W-1,0],[0,H-1],[W-1,H-1],[W>>1,0],[W>>1,H-1],[0,H>>1],[W-1,H>>1]]) {
      const q = (y * W + x) * 4;
      pick.push([d[q], d[q+1], d[q+2]]);
    }
    pick.sort((a, b) => (a[0]+a[1]+a[2]) - (b[0]+b[1]+b[2]));
    const bg = pick[pick.length >> 1];
    const dist2 = (q) => {
      const dr = d[q] - bg[0], dg = d[q+1] - bg[1], db = d[q+2] - bg[2];
      return dr*dr + dg*dg + db*db;
    };
    const T2 = tol * tol;
    // 防误删：紧挨着"明显不是背景色"的像素一律保留（天线、轮毂边这种细结构）
    const edgeGuard = new Uint8Array(W * H);
    const EDGE2 = (tol * 2.2) * (tol * 2.2);
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const idx = y * W + x, q = idx * 4;
        if (dist2(q) > T2) continue;
        let guard = false;
        for (let dy = -1; dy <= 1 && !guard; dy++) {
          const yy = y + dy; if (yy < 0 || yy >= H) continue;
          for (let dx = -1; dx <= 1; dx++) {
            const xx = x + dx; if (xx < 0 || xx >= W) continue;
            if (dx === 0 && dy === 0) continue;
            if (dist2((yy * W + xx) * 4) > EDGE2) { guard = true; break; }
          }
        }
        if (guard) edgeGuard[idx] = 1;
      }
    }
    // 从四边泛洪
    const seen = new Uint8Array(W * H);
    const stack = [];
    for (let x = 0; x < W; x++) { stack.push(x); stack.push((H - 1) * W + x); }
    for (let y = 0; y < H; y++) { stack.push(y * W); stack.push(y * W + W - 1); }
    let removed = 0;
    while (stack.length) {
      const idx = stack.pop();
      if (seen[idx]) continue;
      seen[idx] = 1;
      const q = idx * 4;
      const isBg = d[q + 3] < 8 || (dist2(q) < T2 && !edgeGuard[idx]);
      if (!isBg) continue;
      d[q + 3] = 0;
      removed++;
      const x = idx % W, y = (idx / W) | 0;
      if (x > 0) stack.push(idx - 1);
      if (x < W - 1) stack.push(idx + 1);
      if (y > 0) stack.push(idx - W);
      if (y < H - 1) stack.push(idx + W);
    }
    g.putImageData(id, 0, 0);
    return removed / (W * H);
  }

  /** 按「自动去背」开关预处理一张图 */
  function prepImage(img) {
    const box = document.getElementById('autostrip');
    if (!box || !box.checked) return img;
    const c = document.createElement('canvas');
    c.width = img.width; c.height = img.height;
    c.getContext('2d').drawImage(img, 0, 0);
    hud.dataset.strip = stripBackground(c, 26).toFixed(3);
    return c;
  }

  /** 掩码就绪的 promise：warm 必须等它，否则预跑时场上没有障碍物 */
  let maskReady = Promise.resolve();

  /** 依次尝试若干个地址（gpu/ 下和仓库根下各一份，避免目录搬家就 404） */
  function loadMaskWithFallback(urls) {
    maskReady = (async () => {
      for (const u of urls) {
        const im = await tryLoadImage(u);
        if (im) { maskImg = prepImage(im); uploadMask(); hud.dataset.mask = u; return; }
      }
      hud.textContent = '掩码加载失败: ' + urls.join(' / ');
    })();
    return maskReady;
  }

  const presetName = QS.get('preset');
  const imgUrl = QS.get('img');
  const maskUrls = imgUrl ? [imgUrl]
    : presetName ? ['../presets/' + presetName + '.png', 'presets/' + presetName + '.png']
    : [];
  if (maskUrls.length) loadMaskWithFallback(maskUrls);

  /* ---------------- 色标（LUT） ---------------- */
  // 17 个等距停靠点（turbo/viridis/plasma/inferno 取自 matplotlib；jet 用公式）
  const CMAP_STOPS = {
    turbo: [0.190,0.072,0.232, 0.251,0.252,0.634, 0.276,0.421,0.891, 0.259,0.580,0.999,
            0.158,0.736,0.923, 0.093,0.866,0.762, 0.197,0.949,0.595, 0.428,0.994,0.386,
            0.644,0.990,0.234, 0.795,0.930,0.204, 0.927,0.820,0.226, 0.992,0.684,0.207,
            0.986,0.505,0.134, 0.926,0.325,0.058, 0.824,0.192,0.020, 0.675,0.090,0.004,
            0.480,0.016,0.011],
    viridis: [0.267,0.005,0.329, 0.282,0.095,0.417, 0.279,0.175,0.483, 0.259,0.252,0.525,
              0.230,0.322,0.546, 0.199,0.388,0.555, 0.173,0.449,0.558, 0.149,0.508,0.557,
              0.128,0.567,0.551, 0.120,0.622,0.535, 0.154,0.680,0.504, 0.239,0.736,0.456,
              0.361,0.786,0.388, 0.506,0.829,0.300, 0.668,0.862,0.196, 0.835,0.886,0.103,
              0.993,0.906,0.144],
    plasma: [0.050,0.030,0.528, 0.193,0.018,0.590, 0.300,0.010,0.632, 0.399,0.001,0.656,
             0.495,0.012,0.658, 0.584,0.069,0.633, 0.665,0.139,0.586, 0.736,0.209,0.528,
             0.798,0.280,0.469, 0.850,0.347,0.417, 0.899,0.420,0.363, 0.940,0.498,0.309,
             0.972,0.580,0.255, 0.991,0.670,0.202, 0.994,0.765,0.157, 0.976,0.868,0.143,
             0.940,0.975,0.131],
    inferno: [0.002,0.001,0.014, 0.042,0.028,0.141, 0.129,0.047,0.291, 0.238,0.037,0.396,
              0.342,0.062,0.429, 0.441,0.099,0.432, 0.541,0.135,0.415, 0.640,0.171,0.381,
              0.736,0.216,0.330, 0.817,0.271,0.270, 0.890,0.348,0.198, 0.944,0.443,0.120,
              0.977,0.551,0.039, 0.988,0.668,0.058, 0.976,0.790,0.196, 0.949,0.910,0.395,
              0.988,0.998,0.645],
  };
  const CMAP_NAMES = ['jet', 'turbo', 'viridis', 'plasma', 'inferno'];
  const CMAP_LABELS = { jet: 'Jet（经典彩虹）', turbo: 'Turbo', viridis: 'Viridis',
                        plasma: 'Plasma', inferno: 'Inferno' };
  let CMAP = 'turbo';
  let cmapTex = null;
  /** Jet 色标（标准公式：R/G/B 三通道相位依次错开） */
  function jetRGB(t) {
    const c = (v) => Math.max(0, Math.min(1, v));
    return [c(1.5 - Math.abs(4 * t - 3)),
            c(1.5 - Math.abs(4 * t - 2)),
            c(1.5 - Math.abs(4 * t - 1))];
  }
  function buildCmapLut(name) {
    const stops = CMAP_STOPS[name];
    const data = new Uint8Array(256 * 4);
    for (let i = 0; i < 256; i++) {
      const t = i / 255;
      let r, g, b;
      if (stops) {
        const x = t * 16, k = Math.min(15, Math.floor(x)), f = x - k;
        const j = k * 3, j2 = j + 3;
        r = stops[j] * (1 - f) + stops[j2] * f;
        g = stops[j + 1] * (1 - f) + stops[j2 + 1] * f;
        b = stops[j + 2] * (1 - f) + stops[j2 + 2] * f;
      } else {
        const c = jetRGB(t);
        r = c[0]; g = c[1]; b = c[2];
      }
      data[i * 4] = Math.round(r * 255);
      data[i * 4 + 1] = Math.round(g * 255);
      data[i * 4 + 2] = Math.round(b * 255);
      data[i * 4 + 3] = 255;
    }
    if (!cmapTex) cmapTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, cmapTex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, 256, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
  }

  /* ---------------- 主循环 ---------------- */
  // 三层显示：和 CPU 版一样各自独立开关
  let FIELD_MODE = 0;          // 0 关 / 1 压强 / 2 速度 / 3 涡量
  let SMOKE_ON = 1;
  let PART_MODE = 'stream';    // none / stream / streak / random（默认流线，和 CPU 版一致）
  let BRIGHT = 0.7;
  let SMOKE_HUE = 190;
  let OUTLINE = true;
  let ARROWS = QS.get('arrows') === '1';       // 速度矢量箭头
  let arrowDirty = true;
  let cdNow = 0, clNow = 0;
  let gestureActive = false;       // 有手指/鼠标按在画布上（用来跳过同步读回）
  let PERF = QS.get('perf') === '1';     // ?perf=1 或侧栏「性能数字」开关
  let perfStep = 0, perfRender = 0, perfTotal = 0;
  // 出口边界档位：0 硬吹 / 1 零梯度 / 2 零梯度 + 压力出口（默认，见 gpu/README 的实验记录）
  const OUTLET_IDS = { hard: 0, zero: 1, nrbc: 2 };
  let OUTLET = OUTLET_IDS[QS.get('outlet')];
  if (OUTLET === undefined) OUTLET = 2;

  // 兼容老的 ?view=dye|vel|pressure|particles
  const VIEW_COMPAT = {
    dye: () => { SMOKE_ON = 1; FIELD_MODE = 0; },
    vel: () => { SMOKE_ON = 0; FIELD_MODE = 2; },
    pressure: () => { SMOKE_ON = 0; FIELD_MODE = 1; },
    particles: () => { SMOKE_ON = 1; FIELD_MODE = 0; PART_MODE = 'streak'; },
  };
  if (VIEW_COMPAT[QS.get('view')]) VIEW_COMPAT[QS.get('view')]();

  // 新参数：?field=none|pressure|speed|curl &smoke=0|1 &part=none|stream|streak|random
  const FIELD_IDS = { none: 0, pressure: 1, speed: 2, curl: 3 };
  if (QS.get('field') && FIELD_IDS[QS.get('field')] !== undefined) FIELD_MODE = FIELD_IDS[QS.get('field')];
  if (QS.get('smoke') !== null && QS.get('smoke') !== '') SMOKE_ON = QS.get('smoke') === '1' ? 1 : 0;
  if (QS.get('part') && ['none', 'stream', 'streak', 'random'].indexOf(QS.get('part')) >= 0)
    PART_MODE = QS.get('part');
  if (QS.get('bright')) BRIGHT = parseFloat(QS.get('bright')) || 1;
  if (QS.get('cmap') && CMAP_NAMES.indexOf(QS.get('cmap')) >= 0) CMAP = QS.get('cmap');
  if (QS.get('hue')) SMOKE_HUE = parseFloat(QS.get('hue')) || 190;
  if (QS.get('tool') && ['brush', 'eraser'].indexOf(QS.get('tool')) >= 0) tool = QS.get('tool');
  if (QS.get('scale')) objScale = parseFloat(QS.get('scale')) || 0.7;
  if (QS.get('angle')) objAngle = parseFloat(QS.get('angle')) || 0;
  if (QS.get('ox')) objX = parseFloat(QS.get('ox'));
  if (QS.get('oy')) objY = parseFloat(QS.get('oy'));

  const PARTICLE_LIFE = parseFloat(QS.get('plife') || '3.5');
  const STREAK_LEN = parseFloat(QS.get('streak') || '0.09');   // 短线的长度（按速度×秒数算）

  const FIXED_DT = 1 / 60;
  const WARM = parseInt(QS.get('warm') || '0', 10);   // 同步预跑 N 步（定步长），确定性验证用
  const STILL = QS.get('still') === '1';
  // 无头浏览器不驱动 requestAnimationFrame（截图只走 1-2 帧），?drive=timer 换成定时器，
  // 这样虚拟时间能推进动画，才能验证"主循环"这条路本身
  const DRIVE_TIMER = QS.get('drive') === 'timer';

  let last = performance.now();
  let time = 0;
  let frames = 0, fpsT = 0, fps = 0;
  // 原始帧时间尖峰检测（?spikes=1 显示）
  const SHOW_SPIKES = QS.get('spikes') === '1';
  let frameTimes = [], maxFrameMs = 0, spikeT = 0;

  /** 推进一个物理步（dt 秒）。所有 pass 的读写变量都在这里显式给出 */
  function step(dt) {
    time += dt;

    // 1) 速度自对流
    blit(vB, P.advectVel, (u) => {
      bindTex(0, vA.tex, u.uVel);
      gl.uniform1f(u.dt, dt * SPEED);
      gl.uniform1f(u.dissipation, VEL_DISS);
    });
    [vA, vB] = [vB, vA];

    // 2) 涡量约束（强度为 0 就整段跳过，省一次全屏 pass）
    if (CURL_AMT > 0) {
      blit(vB, P.vorticity, (u) => {
        bindTex(0, vA.tex, u.uVel);
        bindTex(1, solid.tex, u.uSolid);
        gl.uniform1f(u.curlAmount, CURL_AMT);
        gl.uniform1f(u.dt, dt);
      });
      [vA, vB] = [vB, vA];
    }

    // 3) 入口速度边界（带极轻微的上下摆动：完全对称的话物体后面永远不脱涡）
    blit(vB, P.inletVel, (u) => {
      bindTex(0, vA.tex, u.uVel);
      gl.uniform1f(u.inflow, INFLOW);
      const wob = 0.03 * INFLOW * Math.sin(time * 2.4) + 0.015 * INFLOW * Math.sin(time * 6.7);
      gl.uniform1f(u.wobble, wob);
    });
    [vA, vB] = [vB, vA];

    // 4) 散度
    blit(divergence, P.divergence, (u) => {
      bindTex(0, vA.tex, u.uVel);
      bindTex(1, solid.tex, u.uSolid);
    });

    // 5) 压力：Jacobi 迭代（pA/pB 交替）
    for (let i = 0; i < PRESSURE_ITERS; i++) {
      blit(pB, P.pressure, (u) => {
        bindTex(0, pA.tex, u.uPressure);
        bindTex(1, divergence.tex, u.uDiv);
        bindTex(2, solid.tex, u.uSolid);
        gl.uniform1i(u.uOutlet, OUTLET);
      });
      [pA, pB] = [pB, pA];
    }

    // 6) 减压力梯度（投影）
    blit(vB, P.gradient, (u) => {
      bindTex(0, pA.tex, u.uPressure);
      bindTex(1, vA.tex, u.uVel);
      bindTex(2, solid.tex, u.uSolid);
      gl.uniform1f(u.uInflow, INFLOW);
      gl.uniform1i(u.uOutlet, OUTLET);
    });
    [vA, vB] = [vB, vA];

    // 7-8) 染料：烟层关着就整段跳过（看不见的东西不用算）
    if (SMOKE_ON) {
      // 7) 染料对流（显式绑定当前速度 vA）
      blit(dB, P.advectDye, (u) => {
        bindTex(0, vA.tex, u.uVel);
        bindTex(1, dA.tex, u.uDye);
        bindTex(2, solid.tex, u.uSolid);
        gl.uniform1f(u.dt, dt * SPEED);
        gl.uniform1f(u.dissipation, DYE_DISS);
      });
      [dA, dB] = [dB, dA];

      // 8) 入口注入
      blit(dB, P.inlet, (u) => {
        bindTex(0, dA.tex, u.uDye);
        gl.uniform1f(u.time, time);
        gl.uniform1f(u.uWide, QS.get('wide') === '1' ? 1.0 : 0.0);
      });
      [dA, dB] = [dB, dA];
    }

    // 9) 粒子推进（只在用到的时候跑：关掉粒子层就不花这个钱）
    if (PART_MODE === 'streak' || PART_MODE === 'random') {
      blit(pb, P.particle, (u) => {
        bindTex(0, pa.tex, u.uState);
        bindTex(1, vA.tex, u.uVel);
        bindTex(2, solid.tex, u.uSolid);
        gl.uniform1f(u.dt, dt * SPEED);
        gl.uniform1f(u.uLife, PARTICLE_LIFE);
        gl.uniform1f(u.uSeed, (time * 7.31) % 97.0);
      });
      [pa, pb] = [pb, pa];
    }
  }

  /* ---------------- 自动对比度 + 显示 ---------------- */
  // 粗网格采样读回 max|p| / max|v| / max|curl|（每 0.25 s 一次，几百次 1×1 readPixels 很便宜）
  let pMax = 0.2, vMax = 0.5, cMax = 0.05, scaleTime = -1;
  const samplePx = new Float32Array(4);
  const _n1 = [0, 0];
  function read2(fbo, x, y, out) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.readPixels(x, y, 1, 1, gl.RGBA, gl.FLOAT, samplePx);
    out[0] = samplePx[0]; out[1] = samplePx[1];
  }
  function read1(fbo, x, y) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.readPixels(x, y, 1, 1, gl.RGBA, gl.FLOAT, samplePx);
    return samplePx[0];
  }
  function sampleMaxima() {
    // 需要色标或箭头时才采样（都关掉时一次 readPixels 都不做）
    if (FIELD_MODE === 0 && !ARROWS) return;
    const needCurl = FIELD_MODE === 3;
    const needP = FIELD_MODE === 1;
    if (scaleTime >= 0 && time - scaleTime < 0.5) return;
    scaleTime = time;
    let pm = 0, vm = 0, cm = 0;
    const N = 4;                                   // 5×5 = 25 个点，够用且便宜（原来是 121 点）
    for (let iy = 0; iy <= N; iy++) {
      const y = Math.min(SY - 1, Math.floor(iy * SY / N));
      for (let ix = 0; ix <= N; ix++) {
        const x = Math.min(S - 1, Math.floor(ix * S / N));
        if (needP) pm = Math.max(pm, Math.abs(read1(pA.fbo, x, y)));
        read2(vA.fbo, x, y, _n1);
        vm = Math.max(vm, Math.hypot(_n1[0], _n1[1]));
        if (needCurl && x > 0 && x < S - 1 && y > 0 && y < SY - 1) {
          read2(vA.fbo, x + 1, y, _n1); const vyR = _n1[1];
          read2(vA.fbo, x - 1, y, _n1); const vyL = _n1[1];
          read2(vA.fbo, x, y + 1, _n1); const vxT = _n1[0];
          read2(vA.fbo, x, y - 1, _n1); const vxB = _n1[0];
          cm = Math.max(cm, Math.abs(0.5 * ((vyR - vyL) - (vxT - vxB))));
        }
      }
    }
    if (pm > 1e-4) pMax = pMax * 0.6 + pm * 0.4;
    if (vm > 1e-4) vMax = vMax * 0.6 + vm * 0.4;
    if (cm > 1e-6) cMax = cMax * 0.6 + cm * 0.4;
  }

  /** 烟色：HSL → RGB（和 CPU 版的 hue 滑杆同一套观感） */
  function hslToRgb(h, s, l) {
    h = ((h % 360) + 360) % 360 / 360;
    const f = (n) => {
      const k = (n + h * 12) % 12;
      const a = s * Math.min(l, 1 - l);
      return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
    };
    return [f(0), f(8), f(4)];
  }

  let smokeRGB = hslToRgb(190, 0.85, 0.72);
  function render() {
    const pScaleQ = parseFloat(QS.get('pscale') || '1');
    blit(null, P.display, (u) => {
      bindTex(0, dA.tex, u.uDye);
      bindTex(1, vA.tex, u.uVel);
      bindTex(2, solid.tex, u.uSolid);
      bindTex(3, pA.tex, u.uPressure);
      bindTex(4, maskColor.tex, u.uMask);
      gl.activeTexture(gl.TEXTURE5);
      gl.bindTexture(gl.TEXTURE_2D, cmapTex);
      gl.uniform1i(u.uLut, 5);
      gl.uniform1i(u.fieldMode, FIELD_MODE);
      gl.uniform1i(u.smokeOn, SMOKE_ON ? 1 : 0);
      gl.uniform1i(u.outlineOn, OUTLINE ? 1 : 0);
      gl.uniform1i(u.dimSolid, (PART_MODE === 'streak' || PART_MODE === 'random') ? 1 : 0);
      gl.uniform1i(u.uPortrait, PORTRAIT ? 1 : 0);
      // 速度色标上限：至少 1.45 倍来流，让自由流落在色标中段
      // （不然最热的那一小撮把整屏都染成红/橙）
      gl.uniform1f(u.uMaxSpeed, Math.max(INFLOW * 1.45, vMax));
      gl.uniform1f(u.uPScale, pScaleQ / Math.max(1e-4, pMax));
      gl.uniform1f(u.uMaxCurl, pScaleQ / Math.max(1e-5, cMax));
      gl.uniform1f(u.uBright, BRIGHT);
      gl.uniform3f(u.uSmokeColor, smokeRGB[0], smokeRGB[1], smokeRGB[2]);
    });
    if (PART_MODE === 'streak' || PART_MODE === 'random') {
      drawParticles();
      // 流线模式不在这里清主 overlay，流线有自己的 overlay
    } else if (PART_MODE === 'stream') {
      drawStreamlines();
    } else {
      clearOverlay();
    }
    if (ARROWS) drawArrows();
  }

  /** 粒子层：一次 drawArrays 画 PCOUNT 条短线，位置从状态纹理里取 */
  function drawParticles() {
    clearOverlay();
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
    gl.useProgram(P.points.p);
    bindTex(0, pa.tex, P.points.u.uState);
    bindTex(1, vA.tex, P.points.u.uVel);
    gl.uniform1i(P.points.u.uPW, PW);
    gl.uniform1i(P.points.u.uPortrait, PORTRAIT ? 1 : 0);
    gl.uniform1f(P.points.u.uLife, PARTICLE_LIFE);
    // 随机 = 短点，脉线 = 长线
    gl.uniform1f(P.points.u.uStreak, PART_MODE === 'random' ? 0.018 : STREAK_LEN);
    gl.drawArrays(gl.LINES, 0, PCOUNT * 2);
    gl.disable(gl.BLEND);
  }

  /** 速度矢量箭头：一次 drawArrays，NA×NA 支 */
  const ARROW_N = 26;
  function drawArrows() {
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(P.arrows.p);
    bindTex(0, vA.tex, P.arrows.u.uVel);
    bindTex(1, solid.tex, P.arrows.u.uSolid);
    gl.uniform1i(P.arrows.u.uNA, ARROW_N);
    gl.uniform1i(P.arrows.u.uPortrait, PORTRAIT ? 1 : 0);
    gl.uniform1f(P.arrows.u.uLen, 0.9 / ARROW_N);
    gl.uniform1f(P.arrows.u.uMaxSpeed, Math.max(1e-3, vMax));
    // 场背景是亮的就用深色箭头，烟背景是暗的用亮色
    if (FIELD_MODE !== 0) {
      gl.uniform3f(P.arrows.u.uArrowColor, 0.04, 0.05, 0.08);
      gl.uniform1f(P.arrows.u.uArrowAlpha, 0.75);
    } else {
      gl.uniform3f(P.arrows.u.uArrowColor, 0.80, 0.90, 1.0);
      gl.uniform1f(P.arrows.u.uArrowAlpha, 0.45);
    }
    gl.drawArrays(gl.LINES, 0, ARROW_N * ARROW_N * 6);
    gl.disable(gl.BLEND);
  }

  /* ---------------- 流线（读回速度场 + JS 里 RK2 积分，画在覆盖层） ---------------- */
  // 为什么不用着色器：流线要"沿一条线积分几十步"，GPU 得为每个顶点重复积分；
  // 而读回一张 S×S 的速度场只要几毫秒，JS 里积分一次能画几十条 —— 和 CPU 版同一套算法。
  const ov = document.getElementById('overlay');
  const ovx = ov.getContext('2d');
  let velRaw = null, usF = null, vsF = null, velT = -1, tmpA = null, tmpB = null;
  let overlayDirty = true;         // 只有尺寸/位置变了才重新量 getBoundingClientRect（每帧量会触发布局）
  let solidBits = null;            // uploadMask 里留下的固体掩码副本
  let streamCv = null, streamT = -1;   // 流线缓存层（8Hz 重建，每帧只贴图）

  function clearOverlay() {
    if (ov.width && ov.height) ovx.clearRect(0, 0, ov.width, ov.height);
  }

  function syncOverlay() {
    const r = cv.getBoundingClientRect();
    const dpr = Math.min(1.5, window.devicePixelRatio || 1);
    const w = Math.max(1, Math.round(r.width * dpr));
    const h = Math.max(1, Math.round(r.height * dpr));
    if (ov.width !== w || ov.height !== h) { ov.width = w; ov.height = h; }
    ov.style.left = r.left + 'px';
    ov.style.top = r.top + 'px';
    ov.style.width = r.width + 'px';
    ov.style.height = r.height + 'px';
  }

  // 流线专用覆盖层（固定 1.0 DPR，避免高分屏全屏 drawImage 开销）
  const ovStream = document.createElement('canvas');
  ovStream.style.position = 'fixed';
  ovStream.style.left = '0';
  ovStream.style.top = '0';
  ovStream.style.pointerEvents = 'none';
  ovStream.style.zIndex = '5';
  document.body.appendChild(ovStream);
  const ovStreamX = ovStream.getContext('2d');
  let streamOverlayDirty = true;

  function syncStreamOverlay() {
    const r = cv.getBoundingClientRect();
    const w = Math.max(1, Math.round(r.width));    // 1.0 DPR
    const h = Math.max(1, Math.round(r.height));
    if (ovStream.width !== w || ovStream.height !== h) {
      ovStream.width = w; ovStream.height = h;
      streamCv = null;  // 强制下一帧重建流线缓存
      streamT = -1;
    }
    ovStream.style.left = r.left + 'px';
    ovStream.style.top = r.top + 'px';
    ovStream.style.width = r.width + 'px';
    ovStream.style.height = r.height + 'px';
  }

  /**
   * 更新流线用的速度场。
   * 性能要点（之前就卡在这）：
   *   1. 不再读 S² 的整张纹理（512² = 4MB，读一次就掉帧），先 blit 到 160² 的 velSmall 再读（100KB）
   *   2. 平滑改成可分离的两趟一维盒滤波（O(n) 而不是 O(25n)）
   */
  /* GPU timer (only where EXT_disjoint_timer_query_webgl2 exists) */
  const extTimer = gl.getExtension('EXT_disjoint_timer_query_webgl2');
  let gpuQuery = null, gpuBusy = false, gpuMs = 0;
  function gpuTimerBegin() {
    if (!extTimer || gpuBusy) return;
    gpuQuery = gl.createQuery();
    gl.beginQuery(extTimer.TIME_ELAPSED_EXT, gpuQuery);
  }
  function gpuTimerEnd() {
    if (!extTimer || gpuBusy || !gpuQuery) return;
    gl.endQuery(extTimer.TIME_ELAPSED_EXT);
    gpuBusy = true;
  }
  function gpuTimerPoll() {
    if (!extTimer || !gpuBusy || !gpuQuery) return;
    const avail = gl.getQueryParameter(gpuQuery, gl.QUERY_RESULT_AVAILABLE);
    if (!avail) return;
    if (!gl.getParameter(extTimer.GPU_DISJOINT_EXT)) {
      gpuMs = gpuMs * 0.85 + (gl.getQueryParameter(gpuQuery, gl.QUERY_RESULT) / 1e6) * 0.15;
    }
    gl.deleteQuery(gpuQuery);
    gpuQuery = null;
    gpuBusy = false;
  }

  function updateVelField() {
    if (time - velT < 0.8) return;          // 0.8s 一次（原 0.4s），减少同步 readPixels 频率
    velT = time;
    blit(velSmall, P.copySrc, (u) => bindTex(0, vA.tex, u.uSrc));
    const n = VW * VW;
    if (!velRaw || velRaw.length !== n * 4 || !usF || !tmpA) {
      velRaw = new Float32Array(n * 4);
      usF = new Float32Array(n); vsF = new Float32Array(n);
      tmpA = new Float32Array(n * 2); tmpB = new Float32Array(n * 2);   // 交错存 xy，所以是 2n
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, velSmall.fbo);
    gl.readPixels(0, 0, VW, VW, gl.RGBA, gl.FLOAT, velRaw);
    applyVelField();
  }

  function applyVelField() {
    const n = VW * VW;

    // 两趟可分离的一维盒滤波（半径 2）：横向 → 纵向
    const R = 2;
    for (let y = 0; y < VW; y++) {
      for (let x = 0; x < VW; x++) {
        let su = 0, sv = 0, c = 0;
        for (let k = -R; k <= R; k++) {
          const xx = Math.min(VW - 1, Math.max(0, x + k));
          const j = (y * VW + xx) * 4;
          su += velRaw[j]; sv += velRaw[j + 1]; c++;
        }
        const o = (y * VW + x) * 2;
        tmpA[o] = su / c; tmpA[o + 1] = sv / c;
      }
    }
    for (let y = 0; y < VW; y++) {
      for (let x = 0; x < VW; x++) {
        let su = 0, sv = 0, c = 0;
        for (let k = -R; k <= R; k++) {
          const yy = Math.min(VW - 1, Math.max(0, y + k));
          const j = (yy * VW + x) * 2;
          su += tmpA[j]; sv += tmpA[j + 1]; c++;
        }
        const o = (y * VW + x) * 2;
        tmpB[o] = su / c; tmpB[o + 1] = sv / c;
      }
    }
    // 时间低通（0.85 旧 + 0.15 新）：不然流线会像闪电一样抽
    for (let i = 0; i < n; i++) {
      usF[i] = usF[i] * 0.85 + tmpB[i * 2] * 0.15;
      vsF[i] = vsF[i] * 0.85 + tmpB[i * 2 + 1] * 0.15;
    }
  }

  const _s1 = [0, 0], _s2 = [0, 0];
  /** 在 UV 空间采样平滑后的速度（x,y ∈ 0..1） */
  function sampleF(x, y, out) {
    if (x < 0) x = 0; if (y < 0) y = 0;
    if (x > 0.999999) x = 0.999999;
    if (y > 0.999999) y = 0.999999;
    const gx = x * VW - 0.5, gy = y * VW - 0.5;
    const x0 = Math.max(0, Math.min(VW - 1, Math.floor(gx)));
    const y0 = Math.max(0, Math.min(VW - 1, Math.floor(gy)));
    const x1 = Math.min(VW - 1, x0 + 1), y1 = Math.min(VW - 1, y0 + 1);
    const fx = Math.max(0, Math.min(1, gx - x0)), fy = Math.max(0, Math.min(1, gy - y0));
    const i00 = y0 * VW + x0, i10 = y0 * VW + x1, i01 = y1 * VW + x0, i11 = y1 * VW + x1;
    out[0] = (usF[i00] * (1 - fx) + usF[i10] * fx) * (1 - fy) +
             (usF[i01] * (1 - fx) + usF[i11] * fx) * fy;
    out[1] = (vsF[i00] * (1 - fx) + vsF[i10] * fx) * (1 - fy) +
             (vsF[i01] * (1 - fx) + vsF[i11] * fx) * fy;
  }

  /* ---- 流线：双缓冲 + 分片构建（每帧只算 1/4 种子），杜绝周期性尖峰 ---- */
  // 之前是每 0.15s 整体重建一次：120 条线 × 上千步 RK2 + 240 次 stroke，
  // 手机上就是"每 150ms 卡一下"。现在拆到多帧，且描边按速度分 3 桶批量 stroke。
  let streamCvB = null;            // 后台构建的那张（构建完整后跟 streamCv 交换）
  let streamSeeds = null;
  let streamSlice = 0, streamSliceN = 6, streamFirstPass = true;
  let streamDrawn = 0, streamDrawnTotal = 0;
  let streamStartT = 0;

  function streamSeedsList() {
    const rows = 30;
    const out = [];
    for (let s2 = 0; s2 < rows; s2++) out.push([3 / S, (2.5 + s2 * (SY - 5) / (rows - 1)) / SY]);
    // 种子间距不随分辨率线性增长（否则 768 时种子数爆炸）
    // 固定物理距离：~20 网格单位 → S=256 时 step≈0.08，S=768 时 step≈0.027（同样物理密度）
    const stepGrid = 20;              // 固定网格间距
    const stepX = stepGrid / S;
    const stepY = stepGrid / SY;
    for (let y = stepY; y < (SY - 3) / SY; y += stepY) {
      for (let x = stepX; x < (S - 3) / S; x += stepX) out.push([x, y]);
    }
    // 硬上限：最多 200 条流线（够密，再多肉眼也分不清）
    if (out.length > 200) out.length = 200;
    return out;
  }

  function drawStreamlines() {
    if (streamOverlayDirty) { syncStreamOverlay(); streamOverlayDirty = false; }
    if (!usF) return;                       // 帧开头那次读回还没跑过
    if (!streamCv || streamCv.width !== ovStream.width || streamCv.height !== ovStream.height) {
      streamCv = document.createElement('canvas');
      streamCv.width = ovStream.width; streamCv.height = ovStream.height;
      streamCvB = document.createElement('canvas');
      streamCvB.width = ovStream.width; streamCvB.height = ovStream.height;
      streamSeeds = null;
      streamT = -1;
    }
    if (!streamSeeds) streamSeeds = streamSeedsList();

    // 还没开始新一轮：等一下再开工（保证节奏稳定）
    if (streamSlice === 0 && streamT >= 0 && time - streamT < 0.10) return;
    if (streamSlice === 0) {
      // 新一轮：清空后台画布（前台那张继续显示旧的，不清 → 不会闪）
      const bg = streamCvB.getContext('2d');
      bg.setTransform(1, 0, 0, 1, 0, 0);
      bg.clearRect(0, 0, streamCvB.width, streamCvB.height);
      streamStartT = time;
      // 第一轮一次性画完（不然刚打开要等 6 帧才有线）；之后按帧率切片：
      // 帧率高就少切几片（刷新快），帧率低就多切（每帧负担小）
      streamSliceN = streamFirstPass ? 1 : (fps > 45 ? 3 : (fps > 30 ? 4 : 6));
    }
    drawStreamlineSlice(streamSlice, streamSliceN);
    streamSlice++;
    if (streamSlice >= streamSliceN) {
      streamDrawnTotal = streamDrawn; streamDrawn = 0;
      streamFirstPass = false;
      // 一轮画完：直接交换 canvas 引用（零拷贝），并立即贴到 stream overlay
      const tmp = streamCv; streamCv = streamCvB; streamCvB = tmp;
      streamSlice = 0;
      streamT = time;
      ovStreamX.setTransform(1, 0, 0, 1, 0, 0);
      ovStreamX.clearRect(0, 0, ovStream.width, ovStream.height);
      ovStreamX.drawImage(streamCv, 0, 0);
    }
  }

  /** 画第 i 片种子（原地内联 RK2 + 按速度分桶批量描边） */
  function drawStreamlineSlice(i, n) {
    const g = streamCvB.getContext('2d');
    const W = streamCvB.width, H = streamCvB.height;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.lineJoin = 'round';
    g.lineCap = 'round';

    const toPx = PORTRAIT
      ? (fx, fy) => [(1 - fy) * W, (1 - fx) * H]
      : (fx, fy) => [fx * W, fy * H];

    const Hh = 0.55 / S;
    // 最大步数按物理距离算：对流穿越整个域最多 ~S/Hh 步
    // 但硬上限 800 步（足够穿越 768 域），防止高分辨率下步数爆炸
    const MAXSTEP = Math.min(800, Math.ceil(S * 1.8 / 0.55));
    const solidAt = (x, y) => {
      if (!solidBits) return false;
      const gx = Math.min(S - 1, Math.max(0, x * S | 0));
      const gy = Math.min(SY - 1, Math.max(0, y * SY | 0));
      return solidBits[gy * S + gx] !== 0;
    };
    // 三条速度桶，各自一条路径，一次 stroke 画完
    const paths = [new Path2D(), new Path2D(), new Path2D()];
    const speedRef = Math.max(1e-4, INFLOW * 1.2);
    const VWm1 = VW - 1;

    const from = Math.floor(i * streamSeeds.length / n);
    const to = Math.floor((i + 1) * streamSeeds.length / n);
    for (let si = from; si < to; si++) {
      let x = streamSeeds[si][0], y = streamSeeds[si][1];
      if (solidAt(x, y)) continue;
      const p0 = toPx(x, y);
      const path = new Path2D();          // 必须是新的：直接把 paths[0] 拿来用会变成 addPath(自己)
      path.moveTo(p0[0], p0[1]);
      let lastDx = 1, lastDy = 0, drawn = 0, sp2 = 0;
      for (let k = 0; k < MAXSTEP; k++) {
        // ── 内联双线性采样（原来每次调用 sampleF 都要建数组，200k 次/轮太亏）──
        let gx = x * VW - 0.5, gy = y * VW - 0.5;
        let x0 = gx | 0, y0 = gy | 0;
        if (x0 < 0) x0 = 0; if (x0 > VWm1) x0 = VWm1;
        if (y0 < 0) y0 = 0; if (y0 > VWm1) y0 = VWm1;
        const x1 = x0 < VWm1 ? x0 + 1 : x0, y1 = y0 < VWm1 ? y0 + 1 : y0;
        const fx = gx - x0, fy = gy - y0;
        const i00 = y0 * VW + x0, i10 = y0 * VW + x1, i01 = y1 * VW + x0, i11 = y1 * VW + x1;
        const u1 = (usF[i00] * (1 - fx) + usF[i10] * fx) * (1 - fy) + (usF[i01] * (1 - fx) + usF[i11] * fx) * fy;
        const v1 = (vsF[i00] * (1 - fx) + vsF[i10] * fx) * (1 - fy) + (vsF[i01] * (1 - fx) + vsF[i11] * fx) * fy;
        const sp1 = Math.hypot(u1, v1);
        if (sp1 < 1e-4) break;

        // 半步
        const mx = x + (u1 / sp1) * Hh * 0.5, my = y + (v1 / sp1) * Hh * 0.5;
        gx = mx * VW - 0.5; gy = my * VW - 0.5;
        x0 = gx | 0; y0 = gy | 0;
        if (x0 < 0) x0 = 0; if (x0 > VWm1) x0 = VWm1;
        if (y0 < 0) y0 = 0; if (y0 > VWm1) y0 = VWm1;
        const x1b = x0 < VWm1 ? x0 + 1 : x0, y1b = y0 < VWm1 ? y0 + 1 : y0;
        const fxb = gx - x0, fyb = gy - y0;
        const j00 = y0 * VW + x0, j10 = y0 * VW + x1b, j01 = y1b * VW + x0, j11 = y1b * VW + x1b;
        const u2 = (usF[j00] * (1 - fxb) + usF[j10] * fxb) * (1 - fyb) + (usF[j01] * (1 - fxb) + usF[j11] * fxb) * fyb;
        const v2 = (vsF[j00] * (1 - fxb) + vsF[j10] * fxb) * (1 - fyb) + (vsF[j01] * (1 - fxb) + vsF[j11] * fxb) * fyb;
        sp2 = Math.hypot(u2, v2);
        if (sp2 < 1e-4) break;

        let dx = (u2 / sp2) * Hh, dy = (v2 / sp2) * Hh;
        if (k > 0) {
          const maxTurn = 0.10;
          const a0 = Math.atan2(lastDy, lastDx), a1 = Math.atan2(dy, dx);
          let d = a1 - a0;
          while (d > Math.PI) d -= Math.PI * 2;
          while (d < -Math.PI) d += Math.PI * 2;
          const a = a0 + Math.max(-maxTurn, Math.min(maxTurn, d));
          const len = Math.hypot(dx, dy);
          dx = Math.cos(a) * len; dy = Math.sin(a) * len;
        }
        lastDx = dx; lastDy = dy;
        x += dx; y += dy;
        if (x < 0 || x > 1 || y < 0 || y > 1) break;
        if (solidAt(x, y)) break;
        const px = toPx(x, y);
        path.lineTo(px[0], px[1]);
        drawn++;
      }
      if (drawn) { streamDrawn++; paths[Math.min(2, (Math.min(1, sp2 / speedRef) * 3) | 0)].addPath(path); }
    }

    // 批量描边：3 桶 × 2 层 = 6 次 stroke（原来是每条约 2 次）
    for (let b = 0; b < 3; b++) {
      const a2 = 0.80 * (0.62 + 0.38 * (b + 1) / 3);   // 去掉速度耗散后烟更亮，线也要更亮才看得见
      g.lineWidth = Math.max(0.7, 0.9 * dpr);
      g.strokeStyle = 'rgba(165,232,255,' + Math.min(1, a2).toFixed(3) + ')';
      g.stroke(paths[b]);
      g.lineWidth = Math.max(0.5, 0.45 * dpr);
      g.strokeStyle = 'rgba(230,250,255,' + Math.min(1, a2 * 0.55).toFixed(3) + ')';
      g.stroke(paths[b]);
    }
  }

  /* ---------------- 气动力（尾流动量亏损法，和 CPU 版同一个公式） ---------------- */
  let maskBox = null;              // 物体包围盒（格坐标），uploadMask 时算好
  let forceCol = null;             // 气动力读数缓冲（别每次 new）
  let forcesT = -1;
  function updateForces() {
    if (gestureActive) return;       // 拖动/捏合时别插一次同步读回，会更卡
    if (time - forcesT < 0.8) return;  // 同步读回间隔加倍
    forcesT = time;
    if (!maskBox) { cdNow = 0; clNow = 0; renderForces(); return; }
    const U = INFLOW;
    const H = Math.max(4, maskBox.maxY - maskBox.minY + 1);
    // 量测线再往上下游放一点：太靠近物体时"绕流加速"会盖过"尾流亏损"，
    // 换成压力出口后曾经算出负的 Cd
    const xw = Math.min(S - 3, Math.max(maskBox.minX + 2,
      maskBox.maxX + Math.round(H * 1.2)));
    if (!forceCol || forceCol.length !== SY * 4) forceCol = new Float32Array(SY * 4);
    gl.bindFramebuffer(gl.FRAMEBUFFER, vA.fbo);
    gl.readPixels(xw, 0, 1, SY, gl.RGBA, gl.FLOAT, forceCol);
    applyForces();
  }

  function applyForces() {
    const col = forceCol;
    const H = Math.max(4, maskBox.maxY - maskBox.minY + 1);
    // 参考来流用**同一列上下壁附近**的速度，而不是名义 inflow：
    // 我们的域是封闭通道，物体一堵，整列都会加速（阻塞效应），拿名义来流算会得到负阻力
    const Uref = Math.max(1e-4, 0.5 * (col[1 * 4] + col[(SY - 2) * 4]));
    let drag = 0, lift = 0;
    for (let y = 1; y < SY - 1; y++) {
      const uu = col[y * 4], vv = col[y * 4 + 1];
      drag += uu * (Uref - uu);
      lift += uu * vv;
    }
    const ref = 0.5 * Uref * Uref * H;
    cdNow = Math.max(0, drag / ref);   // 被动物体的阻力不可能是负的
    clNow = lift / ref;
    renderForces();
  }
  function renderForces() {
    const cd = document.getElementById('cd');
    const cl = document.getElementById('cl');
    if (cd) cd.textContent = Math.abs(cdNow) < 900 ? cdNow.toFixed(3) : '—';
    if (cl) cl.textContent = Math.abs(clNow) < 900 ? clNow.toFixed(3) : '—';
  }

  /* ---------------- 数值探针 ---------------- */
  // 直接 readPixels 读回整行：一行数字比一张截图省得多，也能精确到小数
  const PROBE_Y = parseFloat(QS.get('py') || '0.5');
  const PROBE_STEP = Math.max(1, Math.floor(S / 16));
  function readRow(target, fy) {
    const y = Math.max(0, Math.min(target.h - 1, Math.floor(fy * target.h)));
    const buf = new Float32Array(target.w * 4);
    gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
    gl.readPixels(0, y, target.w, 1, gl.RGBA, gl.FLOAT, buf);
    return buf;
  }
  function fmtRow(buf) {
    const out = [];
    for (let x = 0; x < buf.length / 4; x += PROBE_STEP) out.push(buf[x * 4].toFixed(2));
    return out.join(' ');
  }
  function probeText() {
    return `t=${time.toFixed(2)} S=${S} py=${PROBE_Y} ` +
           `| dye[${fmtRow(readRow(dA, PROBE_Y))}] ` +
           `| u[${fmtRow(readRow(vA, PROBE_Y))}] ` +
           `| p[${fmtRow(readRow(pA, PROBE_Y))}]`;
  }

  // ?grid=dye|u|p：整场降采样成 ASCII 灰度图（截图替代品，几行就能看出场死没死）
  const GRID_RAMP = ' .:-=+*#%@';
  function gridText(target, ch, scale) {
    const w = target.w, h = target.h;
    const buf = new Float32Array(w * h * 4);
    gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.FLOAT, buf);
    const ROWS = 12, COLS = 40, lines = [];
    for (let r = ROWS - 1; r >= 0; r--) {           // readPixels 自下而上，倒着打
      let line = '';
      for (let c = 0; c < COLS; c++) {
        const x = Math.floor((c + 0.5) * w / COLS);
        const y = Math.floor((r + 0.5) * h / ROWS);
        const norm = Math.max(0, Math.min(1, Math.abs(buf[(y * w + x) * 4 + ch]) / scale));
        line += GRID_RAMP[Math.floor(norm * 9.999)];
      }
      lines.push(line);
    }
    return lines.join('\n');
  }
  function probe() {
    const t = probeText();
    hud.dataset.probe = t;
    hud.textContent = t;
    const which = QS.get('grid');
    if (which) {
      const parts = [];
      if (which === 'p') parts.push('--- pressure ---\n' + gridText(pA, 0, 0.1));
      else if (which === 'u') parts.push('--- u ---\n' + gridText(vA, 0, 0.5));
      else parts.push('--- dye ---\n' + gridText(dA, 0, 1.0));
      const box = document.getElementById('dbg');
      if (box) box.textContent = parts.join('\n');
    }
  }

  /* ---------------- 启动 ---------------- */
  // ?warm=N：先同步跑 N 个定步长帧，再出画面。让无头浏览器也能拿到稳态数值。
  // 顺序很重要：resize 之后再 warm/render，否则第一帧按 300×150 的默认画布尺寸算。
  function boot() {
    resize();
    SY = computeSY(S);            // 场高跟着画布比例（否则整场被拉扁）
    allocTargets();               // 建渲染目标（要在 mask 的异步加载之前）
    maskReady.then(() => {
      buildCmapLut(CMAP);
      if (maskImg) uploadMask();
      initParticles();
      seedDye();                  // 和 CPU 版一样：开局整场就是条纹
      if (WARM > 0) for (let i = 0; i < WARM; i++) step(FIXED_DT);
      if (PART_MODE === 'stream') updateVelField();   // 先填一遍速度场，第一帧就有流线
      render();
      updateForces();
      if (!QS.get('probe')) hud.textContent = `GPU ${S}×${SY} · 压力 ${PRESSURE_ITERS} 次 · 拖动/画笔/滚轮`;
      if (QS.get('probe')) probe();
      if (QS.get('selftest')) runSelfTest();     // 等 warm/mask 都就绪再自检
      if (!STILL) schedule();
    });
  }

  // ?paintdemo=1：在第一帧里画两笔（放在帧里，无头截图才拍得到）
  let paintDemoPending = QS.get('paintdemo') === '1';
  function paintDemo() {
    tool = 'brush'; brush = Math.max(1, Math.round(Math.min(S, SY) / 40));
    for (let k = 0; k < 40; k++) stamp(Math.round(S * 0.45 + k * S / 60), Math.round(SY * 0.35 + k * SY / 90));
    for (let k = 0; k < 24; k++) stamp(Math.round(S * 0.62), Math.round(SY * 0.55 + k * SY / 60));
    flushStamps();
    tool = 'none';
    seedDye();
  }

  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;

    if (paintDemoPending) { paintDemoPending = false; paintDemo(); }
    // 所有同步 readPixels 集中在帧开头：上一帧 GPU 队列此时已跑完，几乎不 stall
    if (PART_MODE === 'stream' && !gestureActive) updateVelField();
    updateForces();
    // sampleMaxima 也挪这：涡量模式 150 次 readPixels、压强 50 次，放 render 里会卡
    sampleMaxima();
    flushStamps();
    if (maskDirty) { maskDirty = false; uploadMask(); }
    gpuTimerPoll();
    gpuTimerBegin();
    const t0 = PERF ? performance.now() : 0;
    step(dt);
    const t1 = PERF ? performance.now() : 0;
    render();
    const t2 = PERF ? performance.now() : 0;
    gpuTimerEnd();
    if (PERF) {
      perfStep = perfStep * 0.9 + (t1 - t0) * 0.1;
      perfRender = perfRender * 0.9 + (t2 - t1) * 0.1;
      perfTotal = perfTotal * 0.9 + (performance.now() - t0) * 0.1;
    }

    // 原始帧时间尖峰检测
    if (SHOW_SPIKES) {
      const frameMs = performance.now() - now;
      frameTimes.push(frameMs);
      if (frameTimes.length > 120) frameTimes.shift();
      const maxNow = Math.max(...frameTimes);
      if (maxNow > maxFrameMs) { maxFrameMs = maxNow; spikeT = time; }
      if (time - spikeT > 3) { maxFrameMs = 0; spikeT = time; }
    }

    if (QS.get('probe') && (time < 2 || Math.random() < 0.02)) probe();

    frames++; fpsT += dt;
    if (fpsT > 0.5) {
      fps = frames / fpsT; frames = 0; fpsT = 0;
      maybeDowngrade();
      let hudText = (hud.dataset.probe ? hud.dataset.probe + ' · ' : '') +
        `GPU ${S}×${SY} · ${fps.toFixed(0)} fps · 压力 ${PRESSURE_ITERS} 次` +
        (hasMask ? ' · 有掩码' : '') +
        (PERF ? ` · 物理 ${perfStep.toFixed(1)}ms 绘制 ${perfRender.toFixed(1)}ms 帧 ${perfTotal.toFixed(1)}ms` : '') +
        (PERF && extTimer ? ` GPU ${gpuMs.toFixed(1)}ms` : '');
      if (SHOW_SPIKES) hudText += ` · 峰值 ${maxFrameMs.toFixed(1)}ms`;
      hud.textContent = hudText;
    }
    schedule();
  }

  // 自适应降级：手机/老设备跑不动 512 时自动降一档（用户手动选过分辨率就不动）
  const RES_LADDER = [128, 192, 256, 384, 512, 768];
  let lowFpsTicks = 0, userSetRes = false;
  function maybeDowngrade() {
    if (userSetRes || WARM > 0 || STILL) return;
    if (fps < 42) lowFpsTicks++; else lowFpsTicks = 0;
    if (lowFpsTicks < 4) return;            // 连续 ~2 秒掉帧才动手
    let idx = 0;
    for (let i = 0; i < RES_LADDER.length; i++) if (RES_LADDER[i] <= S) idx = i;
    if (idx === 0) return;
    lowFpsTicks = 0;
    changeResolution(RES_LADDER[idx - 1]);
    hud.textContent = '掉帧了，自动降到 宽 ' + S + '（可在「分辨率」里改回去）';
  }

  function schedule() {
    if (DRIVE_TIMER) setTimeout(() => frame(performance.now()), 16);
    else requestAnimationFrame(frame);
  }

  /* ---------------- UI ---------------- */
  const $ = (id) => document.getElementById(id);
  // 触摸设备（手机/平板）：手势提示、右键菜单屏蔽都靠它。用 pointer:coarse 判断，
  // 比 UA 靠谱（PC 上的触摸屏也算 touch，但滚轮还可用）
  const IS_TOUCH = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches)
    || 'ontouchstart' in window;
  const IS_NARROW = () => window.innerWidth <= 820;

  $('btnPanel').onclick = () => {
    document.body.classList.toggle('collapsed');
    overlayDirty = true;                       // 画布左边距变了，覆盖层要重新对齐
    streamOverlayDirty = true;                 // 流线 overlay 也要重新对齐
    setTimeout(() => { overlayDirty = true; streamOverlayDirty = true; }, 260);   // 等 CSS 过渡跑完
  };

  // 窄屏默认收起侧栏（抽屉），否则手机上 220px 的侧栏会吃掉一半画布
  if (IS_NARROW()) document.body.classList.add('collapsed');

  // 点遮罩收起抽屉（手机上没有"点外面"的鼠标事件，靠这层）
  $('scrim').onclick = () => document.body.classList.add('collapsed');

  // 手势提示：触屏和鼠标两套文案
  $('gestureHint').textContent = IS_TOUCH
    ? '单指拖动移动物体 · 双指缩放 / 旋转 · 双击回中'
    : '拖动画面移动物体 · 滚轮缩放 · Shift+滚轮旋转 · 双击回中';

  /* ---- 图片 / 预设 / 内置形状 ---- */
  $('btnPick').onclick = () => $('file').click();
  $('file').onchange = (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const url = URL.createObjectURL(f);
    loadMaskWithFallback([url]);
    e.target.value = '';
  };

  $('presets').onchange = (e) => {
    const n = e.target.value;
    if (!n) return;
    objX = 0.3; objY = 0.5; objScale = 0.7; objAngle = 0;
    syncObjUI();
    loadMaskWithFallback(['../presets/' + n + '.png', 'presets/' + n + '.png']);
  };

  $('btnShape').onclick = () => {
    shapeIdx = (shapeIdx + 1) % SHAPE_NAMES.length;
    useShape(SHAPE_NAMES[shapeIdx]);
  };
  function useShape(name) {
    maskImg = makeShapeCanvas(name);
    objX = 0.3; objY = 0.5; objScale = 0.7; objAngle = 0;
    syncObjUI();
    uploadMask();
    seedDye();
    $('btnShape').textContent = '内置形状：' + name;
    $('presets').value = '';
    hud.dataset.mask = 'shape:' + name;
  }

  /* ---- 分辨率：原地重建渲染目标（图片留在内存里，不用重新选） ---- */
  function changeResolution(n) {
    S = Math.max(64, Math.min(1024, n | 0 || 512));
    SY = computeSY(S);
    allocTargets();
    uploadMask();
    seedDye();
    initParticles();
    velT = -1; velRaw = null; usF = null; streamT = -1;      // 流线缓存作废
    $('vSim').textContent = S;
    let best = +$('res').options[0].value;
    for (const o of [...$('res').options]) {
      const v = +o.value;
      if (Math.abs(v - S) < Math.abs(best - S)) best = v;
    }
    $('res').value = String(best);
    hud.dataset.probe = '';
    hud.textContent = `GPU ${S}×${SY} · 已换分辨率`;
  }
  $('res').onchange = (e) => { userSetRes = true; changeResolution(parseInt(e.target.value, 10)); };
  $('vSim').textContent = S;

  /* ---- 手画障碍物 ---- */
  $('tool').onclick = (e) => {
    const b = e.target.closest('button'); if (!b) return;
    [...$('tool').children].forEach(x => x.classList.toggle('on', x === b));
    tool = b.dataset.t;
    cv.style.cursor = tool === 'none' ? 'grab' : 'crosshair';
  };
  $('btnClearPaint').onclick = () => {
    paint = new Uint8Array(S * SY);
    uploadMask();
    seedDye();
  };
  $('brush').oninput = (e) => { brush = +e.target.value; $('vBrush').textContent = brush; };

  /** 把笔迹写进 paint 层（不重建掩码） */
  function stampInto(gx, gy) {
    if (!paint) paint = new Uint8Array(S * SY);
    const v = tool === 'brush' ? 1 : 0;
    const r = brush;
    for (let y = Math.max(1, gy - r); y <= Math.min(SY - 2, gy + r); y++) {
      for (let x = Math.max(1, gx - r); x <= Math.min(S - 2, gx + r); x++) {
        if ((x - gx) * (x - gx) + (y - gy) * (y - gy) <= r * r) paint[y * S + x] = v;
      }
    }
  }

  // 指针事件比帧还密（120Hz），每次重建整张掩码会直接卡死 → 一帧只重建一次
  // 连续手势（拖动/捏合/画笔）里每次都重建整张掩码太贵 → 打个脏标记，帧里统一刷
  let maskDirty = false;
  function requestMaskUpdate() { maskDirty = true; }

  let pendingStamps = [];
  function stamp(gx, gy) { pendingStamps.push([gx, gy]); }
  function flushStamps() {
    if (!pendingStamps.length) return;
    for (const [gx, gy] of pendingStamps) stampInto(gx, gy);
    pendingStamps = [];
    uploadMask();
  }

  /* ---- 物体位置/大小/转角 ---- */
  function syncObjUI() {
    $('px').value = Math.round(objX * 100); $('vPx').textContent = Math.round(objX * 100) + '%';
    $('py').value = Math.round(objY * 100); $('vPy').textContent = Math.round(objY * 100) + '%';
    $('ps').value = Math.round(objScale * 100); $('vPs').textContent = objScale.toFixed(2) + '×';
    $('pa').value = Math.round(objAngle) % 360; $('vPa').textContent = Math.round(objAngle) + '°';
  }

  $('wall').onchange = () => { uploadMask(); seedDye(); };
  $('invert').onchange = () => { uploadMask(); seedDye(); };

  // 黏性：0..100 → 速度耗散 0.9995..0.985（越黏衰减越快）

  /* ---- 按钮 ---- */
  $('btnReset').onclick = () => { resetFlow(); syncObjUI(); };

  $('btnShot').onclick = () => {
    // WebGL 画布默认不保留绘制缓冲 → 先让浏览器把这一帧画出来再取
    render();
    const out = document.createElement('canvas');
    out.width = cv.width; out.height = cv.height;
    const g = out.getContext('2d');
    g.fillStyle = '#05070d';
    g.fillRect(0, 0, out.width, out.height);
    g.drawImage(cv, 0, 0);

    if (PART_MODE === 'stream' && ov.width) {

    const fname = 'wind-tunnel-' + S + '-' + Date.now() + '.png';
    const bridge = window.AndroidBridge;
    if (bridge && bridge.savePng) {
      // Android WebView 里 <a download> 是无效的（没有下载管理器）→ 交给原生写相册
      const dataUrl = out.toDataURL('image/png');
      bridge.savePng(dataUrl.split(',')[1], fname);
      hud.textContent = '已保存：' + fname;

    out.toBlob((blob) => {
      if (!blob) return;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);

      document.body.appendChild(a);
