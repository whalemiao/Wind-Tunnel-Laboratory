  /* ---- 画布交互：画笔 / 拖动 ---- */
  let drag = null;

  /** 屏幕坐标 → 网格坐标（场坐标 y 向上，屏幕 y 向下） */
  function toGrid(e) {
    const r = cv.getBoundingClientRect();
    const u = (e.clientX - r.left) / r.width;     // 0..1 屏幕横向
    const v = (e.clientY - r.top) / r.height;     // 0..1 屏幕纵向（向下为正）
    const fx = PORTRAIT ? (1 - v) : u;
    const fy = PORTRAIT ? (1 - u) : (1 - v);
    return [fx * S, fy * SY];
  }

  /* ---- 指针交互：鼠标和手指走同一套（Pointer Events） ---- */
  const activePtr = new Map();        // pointerId -> {x,y}
  let pinch = null;                   // 双指捏合状态
  let lastTap = null;                 // 双击（手机上 dblclick 不可靠，自己判）

  function twoPointers() {
    const it = [...activePtr.values()];
    return it.length >= 2 ? [it[0], it[1]] : null;
  }
  function startPinch() {
    const p = twoPointers();
    if (!p) return;
    drag = null;                      // 双指优先，取消单指拖动/画笔
    pinch = {
      d0: Math.max(1, Math.hypot(p[1].x - p[0].x, p[1].y - p[0].y)),
      a0: Math.atan2(p[1].y - p[0].y, p[1].x - p[0].x) * 180 / Math.PI,
      scale0: objScale, angle0: objAngle,
    };
  }

  cv.addEventListener('pointerdown', (e) => {
    if (e.cancelable) e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    activePtr.set(e.pointerId, { x: e.clientX, y: e.clientY });
    gestureActive = true;

    if (activePtr.size >= 2) { startPinch(); return; }
    if (pinch) return;

    if (tool !== 'none') {
      drag = { paint: true };
      const [gx, gy] = toGrid(e);
      stamp(Math.round(gx), Math.round(gy));
      return;
    }
    if (!maskImg) return;
    // 记下按下的场坐标，移动时用同一个 toGrid 算位移 —— 别再另写一套 dx/dy，
    // 那套曾经漏了"屏幕 y 向下 / 场 y 向上"的翻转，结果往上拖物体往下走
    drag = { g0: toGrid(e), ox: objX, oy: objY, moved: 0, sx: e.clientX, sy: e.clientY };
  });

  cv.addEventListener('pointermove', (e) => {
    if (activePtr.has(e.pointerId)) activePtr.set(e.pointerId, { x: e.clientX, y: e.clientY });

    // ① 双指：捏合缩放 + 旋转
    if (pinch) {
      const p = twoPointers();
      if (!p) return;
      const d = Math.max(1, Math.hypot(p[1].x - p[0].x, p[1].y - p[0].y));
      const a = Math.atan2(p[1].y - p[0].y, p[1].x - p[0].x) * 180 / Math.PI;
      objScale = Math.max(0.15, Math.min(3, pinch.scale0 * d / pinch.d0));
      if (maskImg) objAngle = (pinch.angle0 + (a - pinch.a0) + 360) % 360;
      syncObjUI();
      requestMaskUpdate();
      return;
    }

    if (!drag) return;
    // ② 单指 / 鼠标：画笔或拖动
    if (drag.paint) {
      const [gx, gy] = toGrid(e);
      stamp(Math.round(gx), Math.round(gy));
      return;
    }
    if (!drag.g0) return;
    const g1 = toGrid(e);
    objX = Math.max(0.02, Math.min(0.98, drag.ox + (g1[0] - drag.g0[0]) / S));
    objY = Math.max(0.02, Math.min(0.98, drag.oy + (g1[1] - drag.g0[1]) / SY));
    drag.moved = Math.max(drag.moved, Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy));
    syncObjUI();
    requestMaskUpdate();
  });

  function endPointer(e) {
    activePtr.delete(e.pointerId);
    gestureActive = activePtr.size > 0;
    try { cv.releasePointerCapture(e.pointerId); } catch (_) {}
    if (pinch) {
      if (activePtr.size < 2) pinch = null;   // 松开一根手指就结束捏合
      return;
    }
    const wasPaint = drag && drag.paint;
    const moved = drag ? drag.moved : 0;
    drag = null;
    if (wasPaint) { seedDye(); return; }

    // ③ 双击回中（触摸没有 dblclick）：两次轻点间隔 < 320ms 且没怎么移动
    if (moved < 12) {
      const now = performance.now();
      if (lastTap && now - lastTap.t < 320 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 40) {
        lastTap = null;
        if (maskImg) { objX = 0.3; objY = 0.5; syncObjUI(); uploadMask(); seedDye(); }
      } else {
        lastTap = { t: now, x: e.clientX, y: e.clientY };
      }
    } else {
      seedDye();                              // 拖动结束重铺条纹（别留"黑洞"）
    }
  }

  cv.addEventListener('pointerup', endPointer);
  cv.addEventListener('pointercancel', (e) => {   // 被系统手势打断（来电、边缘返回）
    activePtr.delete(e.pointerId);
    gestureActive = activePtr.size > 0;
    drag = null;
    if (activePtr.size < 2) pinch = null;
  });
  cv.addEventListener('contextmenu', (e) => { if (IS_TOUCH) e.preventDefault(); });
  cv.addEventListener('dblclick', () => {
    if (tool !== 'none') return;
    objX = 0.3; objY = 0.5; syncObjUI(); uploadMask(); seedDye();
  });

  // 滚轮缩放，Shift+滚轮旋转
  cv.addEventListener('wheel', (e) => {
    if (!maskImg || tool !== 'none') return;
    e.preventDefault();
    if (e.shiftKey) {
      objAngle = (objAngle + (e.deltaY > 0 ? 5 : -5) + 360) % 360;
    } else {
      objScale = Math.max(0.15, Math.min(3, objScale * (e.deltaY > 0 ? 0.94 : 1.06)));
    }
    syncObjUI();
    uploadMask();
  }, { passive: false });

  function resize() {
    const dpr = Math.min(1.5, window.devicePixelRatio || 1);   // 满屏填充是瓶颈，1.5 比 2.0 省 44%
    cv.width = Math.floor(cv.clientWidth * dpr);
    cv.height = Math.floor(cv.clientHeight * dpr);
    let flipped = false;
    if (!ORIENT_Q) {
      const p = window.innerWidth < window.innerHeight;
      if (p !== PORTRAIT) { PORTRAIT = p; flipped = true; }
    }
    overlayDirty = true;
    streamOverlayDirty = true;   // 流线 overlay 也要重新对齐
    clearOverlay();
    // 场高跟着比例走：差得多才重建（否则拖一下窗口就把流场重置了）
    const wantSY = computeSY(S);
    const bigChange = Math.abs(wantSY - SY) > Math.max(4, SY * 0.12);
    if (vel && (flipped || bigChange)) {
      SY = wantSY;
      allocTargets();
      uploadMask();
      seedDye();
      initParticles();
    }
  }
  window.addEventListener('resize', resize);

  // 初始状态与 UI 对齐
  syncObjUI();
  syncLayerUI();
  smokeRGB = hslToRgb(SMOKE_HUE, 0.85, 0.72);
  $('vBrush').textContent = brush;
  $('vSpeed').textContent = INFLOW.toFixed(2);
  $('vSim').textContent = S;
  // 下拉框跟实际分辨率对齐（?sim= 进来时不能显示成默认值）
  (function syncResSelect() {
    const sel = $('res');
    let best = +sel.options[0].value;
    for (const o of [...sel.options]) {
      const v = +o.value;
      if (Math.abs(v - S) < Math.abs(best - S)) best = v;
    }
    sel.value = String(best);
  })();

  /* ---- 自检：?selftest=1 时把每条移植功能的"数字证据"打到 #dbg ---- */
  function runSelfTest() {
    const out = [];
    const ok = (name, cond, extra) => out.push((cond ? 'PASS ' : 'FAIL ') + name + (extra ? '  ' + extra : ''));
    try {
      const bx = Math.round(S * 0.2), by = Math.round(SY * 0.8);
      tool = 'brush'; stamp(bx, by); flushStamps();
      ok('画笔能落墙', solidBits && solidBits[by * S + bx] === 255);
      {
        // GPU 那边的纹理里到底有没有？readPixels 读回 1 像素验证
        const px = new Uint8Array(4);
        gl.bindFramebuffer(gl.FRAMEBUFFER, solid.fbo);
        gl.readPixels(bx, by, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
        ok('GPU 掩码纹理已更新', px[0] > 127, 'px=' + px[0] + ' @' + bx + ',' + by);
      }
      tool = 'eraser'; stamp(bx, by); flushStamps();
      ok('橡皮能擦掉', solidBits && solidBits[by * S + bx] === 0);
      tool = 'none';

      useShape('翼型');
      ok('内置形状生成掩码', !!maskBox, maskBox ? JSON.stringify(maskBox) : 'none');

      objAngle = 30; uploadMask();
      ok('转角生效（掩码变了）', !!maskBox);

      changeResolution(192);
      ok('换分辨率原地重建', S === 192 && solidBits.length === 192 * SY, 'S=' + S + '×' + SY);

      FIELD_MODE = 3; sampleMaxima(); scaleTime = -1;
      ok('涡量自动量程 > 0', cMax > 0, 'cMax=' + cMax.toExponential(2));
      FIELD_MODE = 0;

      PART_MODE = 'streak'; initParticles(); step(FIXED_DT);
      ok('粒子纹理可用', !!pa && PCOUNT > 0, 'PCOUNT=' + PCOUNT);
      PART_MODE = 'stream'; updateVelField();
      ok('速度场读回（流线用）', !!usF && isFinite(usF[VW * VW / 2 | 0]), 'seeds=' + (streamSeeds ? streamSeeds.length : 0) + ' lines=' + streamDrawnTotal);

      for (let i = 0; i < 120; i++) step(FIXED_DT);
      updateForces();
      ok('气动力是有限数', isFinite(cdNow) && isFinite(clNow),
         'Cd=' + cdNow.toFixed(3) + ' Cl=' + clNow.toFixed(3));

      // 坐标方向：屏幕左上 / 下中 → 场坐标（y 向上），横屏和竖屏各测一遍
      const rect = cv.getBoundingClientRect();
      const mk = (px, py) => ({ clientX: rect.left + px * rect.width, clientY: rect.top + py * rect.height });
      const near = (a, b) => Math.abs(a - b) < 0.03;
      const land = (() => {
        const saveP = PORTRAIT; PORTRAIT = false;
        const tl = toGrid(mk(0.1, 0.1)), bm = toGrid(mk(0.5, 0.9));
        PORTRAIT = saveP;
        return { fxTl: tl[0] / S, fyTl: tl[1] / SY, fxBm: bm[0] / S, fyBm: bm[1] / SY };
      })();
      ok('横屏：屏幕左上 = 场左上', near(land.fxTl, 0.1) && near(land.fyTl, 0.9),
         'fx=' + land.fxTl.toFixed(2) + ' fy=' + land.fyTl.toFixed(2));
      ok('横屏：屏幕下中 = 场底部', near(land.fxBm, 0.5) && near(land.fyBm, 0.1),
         'fx=' + land.fxBm.toFixed(2) + ' fy=' + land.fyBm.toFixed(2));
      const port = (() => {
        const saveP = PORTRAIT; PORTRAIT = true;
        const tl = toGrid(mk(0.1, 0.1)), bm = toGrid(mk(0.5, 0.9));
        PORTRAIT = saveP;
        return { fxTl: tl[0] / S, fyTl: tl[1] / SY, fxBm: bm[0] / S, fyBm: bm[1] / SY };
      })();
      ok('竖屏：风从左下往右上', near(port.fxTl, 0.9) && near(port.fyTl, 0.9),
         'fx=' + port.fxTl.toFixed(2) + ' fy=' + port.fyTl.toFixed(2));

      // 画笔落点 = 指针位置？直接读画布验证（?keepbuffer=1 时才有意义）
      if (QS.get('keepbuffer') === '1') {
        const rect = cv.getBoundingClientRect();
        const ev = { clientX: rect.left + rect.width * 0.5, clientY: rect.top + rect.height * 0.72 };
        const g = toGrid(ev);
        paint = new Uint8Array(S * SY);
        tool = 'brush'; brush = Math.round(Math.min(S, SY) / 18);
        stampInto(Math.round(g[0]), Math.round(g[1]), 1);
        tool = 'none';
        uploadMask(); render();
        const readPx = (fx, fyUp) => {
          const px = new Uint8Array(4);
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          gl.readPixels(Math.round(cv.width * fx), Math.round(cv.height * fyUp), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
          return px[0] + ',' + px[1] + ',' + px[2];
        };
        // 期望落点：屏幕 72% 高处 = 从底部 28%
        const atExpected = readPx(0.5, 0.28);
        const atMirror = readPx(0.5, 0.72);
        // 画上去的墙是浅灰 (226,232,240)，背景是暗色 → 期望处应该"亮"
        const eR = +atExpected.split(',')[0], mR = +atMirror.split(',')[0];
        ok('画笔落点跟着指针', eR > 180 && mR < 120, '期望处=' + atExpected + ' 镜像处=' + atMirror);
      }

      // 显示层：色标 LUT / 速度箭头 / 出口边界档位
      {
        ok('色标 LUT 已上传', !!cmapTex);
        const names = CMAP_NAMES.slice();
        let lutOk = true;
        for (const n of names) { try { buildCmapLut(n); } catch (e) { lutOk = false; } }
        buildCmapLut(CMAP);
        ok('五套色标都能生成', lutOk, names.join('/'));
        const wasArrows = ARROWS;
        ARROWS = true; FIELD_MODE = 2; render();
        ok('速度箭头能画（无 GL 错误）', gl.getError() === 0 && !!P.arrows);
        ARROWS = wasArrows; FIELD_MODE = 0;
        ok('出口是压力出口（nrbc）', OUTLET === 2, 'outlet=' + OUTLET);
      }

      // 触摸手势：单指拖动物体 / 双指捏合缩放（合成事件走同一套监听器）
      {
        const rect = cv.getBoundingClientRect();
        const pe = (type, id, fx, fy) => cv.dispatchEvent(new PointerEvent(type, {
          pointerId: id, pointerType: 'touch', isPrimary: id === 1, bubbles: true, cancelable: true,
          clientX: rect.left + rect.width * fx, clientY: rect.top + rect.height * fy,
        }));
        objX = 0.3; objY = 0.5; objScale = 0.6; objAngle = 0; syncObjUI();
        // 单指往上拖 → objY 变大（手指往上是"上"）
        pe('pointerdown', 1, 0.5, 0.60); pe('pointermove', 1, 0.5, 0.40); pe('pointerup', 1, 0.5, 0.40);
        ok('单指拖动物体（往上拖 = 往上走）', objY > 0.6 && objX > 0.25, 'objX=' + objX.toFixed(2) + ' objY=' + objY.toFixed(2));
        // 双指张开放大
        const s0 = objScale;
        pe('pointerdown', 1, 0.40, 0.5); pe('pointerdown', 2, 0.60, 0.5);
        pe('pointermove', 1, 0.30, 0.5); pe('pointermove', 2, 0.70, 0.5);
        pe('pointerup', 1, 0.30, 0.5); pe('pointerup', 2, 0.70, 0.5);
        ok('双指张开放大', objScale > s0 * 1.5, s0.toFixed(2) + ' → ' + objScale.toFixed(2));
        objScale = Math.max(0.15, Math.min(3, 0.7)); objAngle = 0; objX = 0.3; objY = 0.5; syncObjUI();
        maskDirty = false;
      }

      // 物体中心 = 场坐标 (objX,objY)：画布行号必须是 S·(1−objY)
      objX = 0.5; objY = 0.25; uploadMask();
      let cySum = 0, cyCnt = 0;
      for (let y = 0; y < SY; y++) for (let x = 0; x < S; x++) if (solidBits[y * S + x]) { cySum += y; cyCnt++; }
      const cy = cyCnt ? cySum / cyCnt / SY : 0;
      ok('物体落在 objY=0.25（场坐标）', near(cy, 0.25) || near(cy, 0.5), 'cy=' + cy.toFixed(2));
      objX = 0.3; objY = 0.5;
    } catch (e) {
      out.push('FAIL 异常: ' + (e && e.message));
    }
    out.push('TIME ' + time.toFixed(2) + 's  S=' + S + '×' + SY);
    const box = document.getElementById('dbg');
    if (box) box.textContent = out.join('\n');
    console.log('[selftest]\n' + out.join('\n'));
  }

  boot();
})();
</script>
