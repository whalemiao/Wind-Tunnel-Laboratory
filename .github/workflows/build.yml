name: Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'android/**'
      - 'desktop/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write      # 发 Release
  pages: write         # 部署 Pages
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

env:
  RELEASE_TAG: v0.1.5

jobs:
  # ── 1. 安卓 APK ─────────────────────────────────────────────
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/wind-tunnel-lab.apk
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/wind-tunnel-lab.apk
          if-no-files-found: error

  # ── 2. Windows EXE ──────────────────────────────────────────
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish single-file exe
        working-directory: desktop
        run: >
          dotnet publish -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o ../out

      - name: Show output
        run: |
          dir out
          Get-Item out/WindTunnelLab.exe | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}}

      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: out/WindTunnelLab.exe
          if-no-files-found: error

  # ── 3. 发布到 Release（两个安装包一起）─────────────────────
  release:
    needs: [apk, exe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: exe
          path: dist

      - name: List assets
        run: ls -lh dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: 风洞实验室 ${{ env.RELEASE_TAG }}
          body: |
            两个安装包，网页版同一份代码：

            | 平台 | 文件 | 说明 |
            | --- | --- | --- |
            | Windows | `WindTunnelLab.exe` | 单文件，自带 .NET 运行时，双击即用 |
            | Android | `wind-tunnel-lab.apk` | debug 签名，安装时允许「未知来源」 |

            网页版：https://whalemiao.github.io/Wind-Tunnel-Laboratory/

            如果这里下载不动（要跳 objects.githubusercontent.com），
            用 Pages 上的同一份文件：
            - EXE https://whalemiao.github.io/Wind-Tunnel-Laboratory/WindTunnelLab.exe
            - APK https://whalemiao.github.io/Wind-Tunnel-Laboratory/wind-tunnel-lab.apk
          files: |
            dist/wind-tunnel-lab.apk
            dist/WindTunnelLab.exe
          make_latest: true

  # ── 4. Pages（网页 + 两个安装包都在同一目录）───────────────
  pages:
    needs: [apk, exe]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: site

      - name: Download EXE
        uses: actions/download-artifact@v4
        with:
          name: exe
          path: site

      - name: Copy web files
        run: |
          mkdir -p site
          cp index.html v1-lbm.html test-tank.png site/
          cp -r shots site/ 2>/dev/null || true
          cp README.md site/ 2>/dev/null || true
          touch site/.nojekyll
          ls -lh site

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
