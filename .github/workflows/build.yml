name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write      # 发 Release
  pages: write         # 部署 Pages
  id-token: write

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p apk-out
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-out/wind-tunnel-lab.apk
          ls -lh apk-out

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: apk-out/wind-tunnel-lab.apk
          if-no-files-found: error

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.3
          name: 风洞实验室 v0.1.3
          body: |
            安卓 APK（debug 签名，可直接安装；安装时需允许「未知来源」）。

            安装包也放在网页同目录，下载更快：
            https://whalemiao.github.io/Wind-Tunnel-Laboratory/wind-tunnel-lab.apk
          files: apk-out/wind-tunnel-lab.apk
          make_latest: true

  pages:
    needs: apk
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download APK into site dir
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: site

      - name: Copy site files
        run: |
          mkdir -p site
          cp index.html v1-lbm.html test-tank.png site/ 2>/dev/null || true
          cp -r shots site/ 2>/dev/null || true
          cp README.md site/ 2>/dev/null || true
          touch site/.nojekyll
          ls -lh site

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
