name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write      # 发 Release 需要

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/wind-tunnel-lab.apk
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: wind-tunnel-lab-apk
          path: out/wind-tunnel-lab.apk
          if-no-files-found: error

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 风洞实验室 APK（自动构建）
          body: |
            由 GitHub Actions 自动构建的 debug APK（未签名发布，可直接安装）。
            安装前需要在系统设置里允许「安装未知来源应用」。
          files: out/wind-tunnel-lab.apk
          make_latest: true